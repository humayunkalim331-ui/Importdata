      const { ranked: sumRanked, allSuppliersByVolume: sumByVol, totalQtyAllSuppliers: sumTotalQty, actualWeightedSumAll: sumWeightedSum } =
        computeLandedCostRanking(impRows, impMapping, state.files.import?.headers, "supplier", item);
      if(sumRanked.length>0){
        summaryCards.push({ label:"CHEAPEST DUTY-PAID COST", value:`${fmtPricePerKg(sumRanked[0][1])} PKR/KG`, note: sumRanked[0][0].slice(0,26) });
      }
      if(sumByVol.length>0){
        summaryCards.push({ label:"TOP SUPPLIER BY VOLUME", value:`${sumByVol[0][2].toFixed(0)}%`, note: sumByVol[0][0].slice(0,26) + (sumByVol[0][2]>=40?" ⚠":"") });
      }
      const sumMom = monthOverMonthMovement(impRows, impMapping);
      if(sumMom){
        const up = sumMom.pctChange >= 0;
        summaryCards.push({ label:"PRICE TREND (MoM)", value:`${up?'▲':'▼'} ${Math.abs(sumMom.pctChange).toFixed(1)}%`, note: `${monthLabel(sumMom.priorMonth)} → ${monthLabel(sumMom.latestMonth)}` });
      }
      const sumDpcMom = landedCostMonthOverMonth(impRows, impMapping, state.files.import?.headers);
      if(sumDpcMom){
        const up = sumDpcMom.pctChange >= 0;
        summaryCards.push({ label:"DUTY-PAID COST TREND", value:`${up?'▲':'▼'} ${Math.abs(sumDpcMom.pctChange).toFixed(1)}%`, note: `${monthLabel(sumDpcMom.priorMonth)} → ${monthLabel(sumDpcMom.latestMonth)}` });
      }
      if(sumRanked.length>=2 && sumTotalQty>0){
        const blended = sumWeightedSum/sumTotalQty;
        const saving = blended - sumRanked[0][1];
        if(saving > 0.01) summaryCards.push({ label:"SAVINGS POTENTIAL", value:`${fmtPricePerKg(saving)} PKR/KG`, note:"vs. cheapest, blended" });
      }
      if(sumByVol.length>0){
        summaryCards.push({ label:"SUPPLIERS USED", value:`${sumByVol.length}`, note: sumByVol.length<=2 ? "low diversification" : "distinct suppliers matched" });
      }
      const sumCurExp = currencyExposure(impRows, impMapping);
      if(sumCurExp && sumCurExp.length>1){
        summaryCards.push({ label:"CURRENCY EXPOSURE", value:`${sumCurExp[0].pct.toFixed(0)}% ${sumCurExp[0].currency}`, note: `+${sumCurExp.length-1} other currenc${sumCurExp.length-1===1?"y":"ies"}` });
      }
      if(impMapping?.gd){
        let hcQty = 0, fsQty = 0, otherQty = 0;
        impRows.forEach(r=>{
          const code = extractGdSchemeCode(r[impMapping.gd]);
          const q = num(r[impMapping.qty]);
          if(isNaN(q)) return;
          if(code === "HC") hcQty += q; else if(code === "FS") fsQty += q; else otherQty += q;
        });
        const schemeTotalQty = hcQty + fsQty + otherQty;
        if(schemeTotalQty > 0){
          summaryCards.push({ label:"DUTY PAID vs EFS", value:`${(hcQty/schemeTotalQty*100).toFixed(0)}% / ${(fsQty/schemeTotalQty*100).toFixed(0)}%`, note:"by volume, HC / FS" });
        }
      }

      const cardW = 2.2, cardGap = 0.15, cardX0 = 0.6, cardY0 = 1.2, cardH = 1.1, rowGap = 0.15;
      const cardShapes = [];
      summaryCards.slice(0,10).forEach((c,i)=>{
        const row = Math.floor(i/5), col = i%5;
        const cx = cardX0 + col*(cardW+cardGap);
        const cy = cardY0 + row*(cardH+rowGap);
        cardShapes.push(pptxRect({x:pptxIn(cx), y:pptxIn(cy), w:pptxIn(cardW), h:pptxIn(cardH), fill:"2A3038"}));
        cardShapes.push(pptxTextBox({x:pptxIn(cx+0.1), y:pptxIn(cy+0.08), w:pptxIn(cardW-0.2), h:pptxIn(0.28), text:c.label, fontSize:7.5, bold:true, color:"9AA5B1"}));
        cardShapes.push(pptxTextBox({x:pptxIn(cx+0.1), y:pptxIn(cy+0.36), w:pptxIn(cardW-0.2), h:pptxIn(0.38), text:c.value, fontSize:14, bold:true, color:"FFFFFF"}));
        cardShapes.push(pptxTextBox({x:pptxIn(cx+0.1), y:pptxIn(cy+0.76), w:pptxIn(cardW-0.2), h:pptxIn(0.3), text:c.note, fontSize:7, color:"9AA5B1"}));
      });
      const numRows = Math.ceil(Math.min(summaryCards.length,10)/5);
      const tableY = cardY0 + numRows*(cardH+rowGap) + 0.15;

      const top5Rows = sumRanked.slice(0,5).map(([name,lc,qty,,pct],i)=>[String(i+1), name, fmtQtyMt(qty), `${pct.toFixed(1)}%`, fmtPricePerKg(lc)]);
      const tableShapes = top5Rows.length
        ? [pptxTextBox({x:pptxIn(0.6), y:pptxIn(tableY), w:pptxIn(6), h:pptxIn(0.3), text:"Top 5 suppliers by duty-paid cost:", fontSize:11, bold:true, color:DARK}),
           pptxTable({x:pptxIn(0.6), y:pptxIn(tableY+0.35), w:pptxIn(11.0), rowH:pptxIn(0.4), headers:["#","Supplier","Qty (MT)","% Vol","Duty-Paid Cost/KG"], rows:top5Rows})]
        : [];

      addSlide(pptxSlideXml([
        pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
        pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
        pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Director Summary", fontSize:24, bold:true, color:"FFFFFF"}),
        ...cardShapes,
        ...tableShapes,
      ]));
    }

    // Slide 2b — Our Company Position (company-specific mirror of the slide above) — only when
    // "Our company name" is set. Mirrors the on-screen Company View drill-down exactly: same
    // ourRowsOnly-scoped calculation, same "— Ours" labeling convention, so the director sees
    // both the whole-market picture (previous slide) and this specific company's own picture
    // as two clearly separate, clearly labeled views — not one blurred together.
    if(state.ourCompanyName && state.ourCompanyName.trim()){
      const ourRowsOnlyForPpt = impMapping?.importer
        ? impRows.filter(r => companyKey(r[impMapping.importer]) === companyKey(state.ourCompanyName))
        : [];
      if(ourRowsOnlyForPpt.length > 0){
        const companyCards = [];
        const ourDataCo = ourQtyAndPrice(impRows, impMapping, manual, state.ourCompanyName);
        const byImpCo = aggregateBy(excludeOurCompany(impRows, impMapping, "importer", state.ourCompanyName), impMapping.importer, impMapping, companyKey);
        if(ourDataCo && byImpCo.length>0){
          const allQ = [...byImpCo.map(([,v])=>v.qty), ourDataCo.qty].sort((a,b)=>b-a);
          const rank = allQ.indexOf(ourDataCo.qty)+1;
          const top1 = [...byImpCo].sort((a,b)=>b[1].qty-a[1].qty)[0];
          const note = rank===1
            ? (top1 ? `We're largest — next: ${top1[0].slice(0,18)} @ ${fmtQtyMt(top1[1].qty)} MT` : "We're the largest")
            : (top1 ? `#1: ${top1[0].slice(0,18)} @ ${fmtQtyMt(top1[1].qty)} MT` : "");
          companyCards.push({ label:"OUR RANK (BY QTY)", value:`#${rank} of ${allQ.length}`, note });
        }
        if(ourDataCo && ourDataCo.priceAvg!==null && !isNaN(ourDataCo.priceAvg)){
          const { prices: sp2 } = dominantCurrencyPrices(excludeOurCompany(impRows, impMapping, "importer", state.ourCompanyName), impMapping);
          if(sp2.length>0){
            const allP = [...sp2, ourDataCo.priceAvg].sort((a,b)=>a-b);
            companyCards.push({ label:"OUR RANK (BY PRICE)", value:`#${allP.indexOf(ourDataCo.priceAvg)+1} of ${allP.length}`, note:"lowest = #1" });
          }
        }
        const coPriceMom = monthOverMonthMovement(ourRowsOnlyForPpt, impMapping);
        if(coPriceMom){
          const up = coPriceMom.pctChange >= 0;
          companyCards.push({ label:"PRICE TREND — OURS", value:`${up?'▲':'▼'} ${Math.abs(coPriceMom.pctChange).toFixed(1)}%`, note:`${monthLabel(coPriceMom.priorMonth)} → ${monthLabel(coPriceMom.latestMonth)}` });
        }
        const coDpcMom = landedCostMonthOverMonth(ourRowsOnlyForPpt, impMapping, state.files.import?.headers);
        if(coDpcMom){
          const up = coDpcMom.pctChange >= 0;
          companyCards.push({ label:"DUTY-PAID TREND — OURS", value:`${up?'▲':'▼'} ${Math.abs(coDpcMom.pctChange).toFixed(1)}%`, note:`${monthLabel(coDpcMom.priorMonth)} → ${monthLabel(coDpcMom.latestMonth)}` });
        }
        // Our own savings potential — our own blended duty-paid cost vs the cheapest available
        const { ranked: coRanked } = computeLandedCostRanking(impRows, impMapping, state.files.import?.headers, "supplier", item);
        if(coRanked.length>=1){
          const lcCols2 = detectLandedCostColumns(state.files.import?.headers || []);
          let wsum=0, wqty=0;
          ourRowsOnlyForPpt.forEach(r=>{
            const q = num(r[impMapping.qty]);
            if(isNaN(q)||q<=0) return;
            const dpc = landedCostPerUnit(r, lcCols2, q, impMapping);
            if(dpc===null||isNaN(dpc)) return;
            wsum += dpc*q; wqty += q;
          });
          if(wqty>0){
            const ourBlended = wsum/wqty;
            const coSaving = ourBlended - coRanked[0][1];
            if(coSaving > 0.01) companyCards.push({ label:"SAVINGS POTENTIAL — OURS", value:`${fmtPricePerKg(coSaving)} PKR/KG`, note:"vs. cheapest available" });
          }
        }
        const distinctSuppliersCo = impMapping.supplier ? new Set(ourRowsOnlyForPpt.map(r=>companyKey(r[impMapping.supplier]))).size : 0;
        if(distinctSuppliersCo>0){
          companyCards.push({ label:"SUPPLIERS USED — OURS", value:`${distinctSuppliersCo}`, note: distinctSuppliersCo<=2?"low diversification":"distinct suppliers, our own purchases" });
        }

        const coCardW = 2.2, coCardGap = 0.15, coCardX0 = 0.6, coCardY0 = 1.2, coCardH = 1.1, coRowGap = 0.15;
        const coCardShapes = [];
        companyCards.slice(0,10).forEach((c,i)=>{
          const row = Math.floor(i/5), col = i%5;
          const cx = coCardX0 + col*(coCardW+coCardGap);
          const cy = coCardY0 + row*(coCardH+coRowGap);
          coCardShapes.push(pptxRect({x:pptxIn(cx), y:pptxIn(cy), w:pptxIn(coCardW), h:pptxIn(coCardH), fill:"2A3038"}));
          coCardShapes.push(pptxTextBox({x:pptxIn(cx+0.1), y:pptxIn(cy+0.08), w:pptxIn(coCardW-0.2), h:pptxIn(0.28), text:c.label, fontSize:7.5, bold:true, color:GOLD}));
          coCardShapes.push(pptxTextBox({x:pptxIn(cx+0.1), y:pptxIn(cy+0.36), w:pptxIn(coCardW-0.2), h:pptxIn(0.38), text:c.value, fontSize:14, bold:true, color:"FFFFFF"}));
          coCardShapes.push(pptxTextBox({x:pptxIn(cx+0.1), y:pptxIn(cy+0.76), w:pptxIn(coCardW-0.2), h:pptxIn(0.3), text:c.note, fontSize:7, color:"9AA5B1"}));
        });

        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(9.5), h:pptxIn(0.5), text:`Our Company Position — ${state.ourCompanyName}`, fontSize:22, bold:true, color:"FFFFFF"}),
          ...coCardShapes,
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(coCardY0 + Math.ceil(Math.min(companyCards.length,10)/5)*(coCardH+coRowGap) + 0.2), w:pptxIn(11.5), h:pptxIn(0.6), text:`This slide reflects only ${escHtml(state.ourCompanyName)}'s own shipments for this item — the previous slide shows the whole matched market for comparison.`, fontSize:10.5, color:GREY}),
        ]));
      }
    }

    // Slide 2c — Company Portfolio Overview — every catalog item where "Our company name" has
    // matched data, in one glance-view table, mirroring the on-screen Company View. Split across
    // multiple slides if the portfolio has more items than fit on one.
    if(state.ourCompanyName && state.ourCompanyName.trim()){
      const portfolioResults = computeCompanyViewResults(state.ourCompanyName);
      if(portfolioResults.length > 0){
        const rowsPerSlide = 10;
        const portfolioRows = portfolioResults.map(r=>{
          const qtyRankStr = r.qtyRank!==null ? `#${r.qtyRank} of ${r.qtyOf}` : "—";
          const priceRankStr = r.priceRank!==null ? `#${r.priceRank} of ${r.priceOf}` : "—";
          const priceTrendStr = r.priceMom ? `${r.priceMom.pctChange>=0?'▲':'▼'} ${Math.abs(r.priceMom.pctChange).toFixed(1)}%` : "n/a";
          const dpcTrendStr = r.dpcMom ? `${r.dpcMom.pctChange>=0?'▲':'▼'} ${Math.abs(r.dpcMom.pctChange).toFixed(1)}%` : "n/a";
          return [r.item.name, r.item.hs, fmtQtyMt(r.ourData.qty), qtyRankStr, priceRankStr, priceTrendStr, dpcTrendStr];
        });
        for(let start=0; start<portfolioRows.length; start+=rowsPerSlide){
          const chunk = portfolioRows.slice(start, start+rowsPerSlide);
          const pageNote = portfolioRows.length>rowsPerSlide ? ` (${Math.floor(start/rowsPerSlide)+1} of ${Math.ceil(portfolioRows.length/rowsPerSlide)})` : "";
          addSlide(pptxSlideXml([
            pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
            pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
            pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:`Company Portfolio Overview — ${state.ourCompanyName}${pageNote}`, fontSize:20, bold:true, color:"FFFFFF"}),
            pptxTable({x:pptxIn(0.5), y:pptxIn(1.2), w:pptxIn(12.3), rowH:pptxIn(0.5), headers:["Item","HS Code","Our Qty (MT)","Rank (Qty)","Rank (Price)","Price Trend","Duty-Paid Trend"], rows:chunk}),
            pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.2+0.5*(chunk.length+1)+0.2), w:pptxIn(11.7), h:pptxIn(0.5), text:`${portfolioResults.length} item${portfolioResults.length===1?"":"s"} with matched data for this company, across the whole catalog.`, fontSize:10, color:GREY}),
          ]));

      }

    // Slide 3 — Our Position (scorecard table) — uses the same qty-first, real-data-preferred
    // ranking as everywhere else in the tool (rank banner, Director Summary), not the old
    // manual-entry-only, price-only logic this slide had been stuck on.
    const posData = ourQtyAndPrice(impRows, impMapping, manual);
    let qtyRankLine = "n/a — map the Importer and Quantity columns, or enter our quantity";
    let priceRankLine = "n/a — enter unit price and map the import price column";
    if(posData && impMapping?.importer && impMapping?.qty){
      const byImpPos = aggregateBy(excludeOurCompany(impRows, impMapping, "importer"), impMapping.importer, impMapping, companyKey);
      if(byImpPos.length>0){
        const allQ = [...byImpPos.map(([,v])=>v.qty), posData.qty].sort((a,b)=>b-a);
        qtyRankLine = `#${allQ.indexOf(posData.qty)+1} of ${allQ.length} matched importers (largest = #1)${posData.source==="real"?" — using our real matched data":""}`;
      }
    }
    if(posData && posData.priceAvg!==null && !isNaN(posData.priceAvg) && impMapping?.price){
      const { prices, currency: rankCur } = dominantCurrencyPrices(excludeOurCompany(impRows, impMapping, "importer"), impMapping);
      if(prices.length){
        const allP = [...prices, posData.priceAvg].sort((a,b)=>a-b);
        priceRankLine = `#${allP.indexOf(posData.priceAvg)+1} of ${allP.length} matched importers${rankCur?` in ${rankCur}`:""} (lowest price = #1)`;
      }
    }
    const trendImp = buildSeries(impRows, impMapping);
    const trendDir = trendImp.length>=2
      ? (trendImp[trendImp.length-1].price > trendImp[0].price ? "Rising" : trendImp[trendImp.length-1].price < trendImp[0].price ? "Falling" : "Flat")
      : "Not enough data points";
    let vsMarketLine = "n/a";
    if(posData && posData.priceAvg!==null && !isNaN(posData.priceAvg) && impMapping?.price){
      const { prices, pairs, currency: vsCur } = dominantCurrencyPrices(excludeOurCompany(impRows, impMapping, "importer"), impMapping);
      if(prices.length){
        const avg = weightedAverage(pairs);
        const diffPct = ((posData.priceAvg-avg)/avg*100);
        vsMarketLine = `${Math.abs(diffPct).toFixed(1)}% ${diffPct>=0?"above":"below"} quantity-weighted market average (${avg.toFixed(2)}${vsCur?` ${vsCur}`:""})`;
      }
    }
    const scorecardRows = [
      ["Quantity", posData ? `${fmtQtyMt(posData.qty)} MT${posData.source==="real"?" (real data)":""}` : String(manual.qty || "n/a")],
      ["Unit Price", posData && posData.priceAvg!==null ? `${posData.priceAvg.toFixed(2)} ${posData.currency||manual.currency||""}`.trim() : `${manual.price || "n/a"} ${manual.currency || ""}`.trim()],
      ["Supplier", String(manual.supplier || "n/a")],
      ["Rank by Quantity (priority metric)", qtyRankLine],
      ["Rank by Unit Price", priceRankLine],
      ["Vs. market average", vsMarketLine],
      ["Import price trend (selected period)", trendDir],
    ];
    const positionNarration = posData && vsMarketLine!=="n/a"
      ? `By quantity, we are ranked ${qtyRankLine}. By unit price, we are currently ${vsMarketLine}, ranked ${priceRankLine}. The import price trend for the selected period is ${trendDir.toLowerCase()}, which should factor into the timing of the next purchase.`
      : `Enter our current quantity, unit price, and supplier above (or set "Our company name" to use our real matched data automatically) to populate the market ranking and comparison for this item.`;
    addSlide(pptxSlideXml([
      pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
      pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Our Current Position", fontSize:24, bold:true, color:"FFFFFF"}),
      pptxTable({x:pptxIn(0.8), y:pptxIn(1.2), w:pptxIn(10.5), rowH:pptxIn(0.5), headers:["Metric","Value"], rows:scorecardRows}),
      pptxTextBox({x:pptxIn(0.8), y:pptxIn(1.2)+pptxIn(0.5)*(scorecardRows.length+1)+pptxIn(0.2), w:pptxIn(10.9), h:pptxIn(1.1), text:positionNarration, fontSize:12, color:GREY}),
    ]));

    // Slide 3 — Last Importer Data: Top 5 Competitors (month x competitor, matches the on-screen section)
    if(showImport){
      const pivot = monthlyPivot(impRows, impMapping, "importer", 5);
      if(pivot){
        const colCount = pivot.headers.length;
        const tableW = Math.min(pptxIn(12.1), colCount * pptxIn(2.0));
        const narration = pivot.cheapest
          ? `${pivot.cheapest.name} has offered the most competitive matched price in this window, at ${pivot.cheapest.price.toFixed(2)}${pivot.cheapest.currency?` ${pivot.cheapest.currency}`:""}. Use this table to benchmark upcoming negotiations against actual recent shipment prices rather than a blended average.`
          : `This table lists actual shipment prices by month for our top 5 matched competitors by volume — use it to benchmark upcoming negotiations against real transactions.`;
        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Last Importer Data — Top 5 Competitors (Import Customs Data)", fontSize:20, bold:true, color:"FFFFFF"}),
          pptxTable({x:pptxIn(0.6), y:pptxIn(1.1), w:tableW, rowH:pptxIn(0.5), headers:pivot.headers, rows:pivot.rows}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.1)+pptxIn(0.5)*(pivot.rows.length+1)+pptxIn(0.15), w:pptxIn(11.7), h:pptxIn(1.0), text:`Unit price shown per matched shipment, averaged by month. Our current price: ${manual.price||"n/a"} ${manual.currency||""}. ${narration}`, fontSize:12, color:GREY}),
        ]));
      }
    }

    // Slide 4 — Top Importers (matches on-screen "Top importers — HS <code>")
    if(showImport){
      const rows = pptxTopRows(impRows, impMapping, "importer", "origin");
      if(rows.length){
        const impAgg = aggregateBy(impRows, impMapping.importer, impMapping, companyKey);
        const leader = impAgg[0];
        const cheapestImp = [...impAgg].filter(([,v])=>v.priceAvg!==null).sort((a,b)=>a[1].priceAvg-b[1].priceAvg)[0];
        const narration = `${leader[0]} is the largest matched importer by volume (${leader[1].qty.toLocaleString()} units)`
          + (cheapestImp && cheapestImp[0]!==leader[0] ? `, while ${cheapestImp[0]} offers the most competitive matched price at ${cheapestImp[1].priceAvg.toFixed(2)}${cheapestImp[1].currency?` ${cheapestImp[1].currency}`:""}` : "")
          + `. Compare these terms against our current supplier before the next order.`;
        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:`Top Importers — HS ${item.hs}`, fontSize:22, bold:true, color:"FFFFFF"}),
          pptxTable({x:pptxIn(0.6), y:pptxIn(1.2), w:pptxIn(11.5), rowH:pptxIn(0.55), headers:["Importer","Country","Qty (MT)","Unit Price (per KG)"], rows}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.2)+pptxIn(0.55)*(rows.length+1)+pptxIn(0.2), w:pptxIn(11.7), h:pptxIn(0.9), text:narration, fontSize:13, color:GREY}),
        ]));
      }
    }

    // Slide 5 — Region-wise Comparison: Imports (by Country of Origin)
    if(showImport){
      const rows = pptxRegionRows(impRows, impMapping, "origin");
      if(rows.length){
        const regionAgg = aggregateBy(impRows, impMapping.origin, impMapping);
        const topRegion = regionAgg[0];
        const narration = `${topRegion[0]} is the dominant sourcing origin by volume for matched imports (${topRegion[1].qty.toLocaleString()} units), averaging ${topRegion[1].priceAvg!==null?topRegion[1].priceAvg.toFixed(2):"n/a"}${topRegion[1].currency?` ${topRegion[1].currency}`:""}. Consider whether diversifying sourcing origins could reduce single-region dependency risk.`;
        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Region-wise Comparison — Imports (by Country of Origin)", fontSize:20, bold:true, color:"FFFFFF"}),
          pptxTable({x:pptxIn(0.6), y:pptxIn(1.2), w:pptxIn(10.5), rowH:pptxIn(0.55), headers:["Country of Origin","Qty","Avg Unit Price"], rows}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.2)+pptxIn(0.55)*(rows.length+1)+pptxIn(0.2), w:pptxIn(11.7), h:pptxIn(0.9), text:narration, fontSize:13, color:GREY}),
        ]));
      }
    }

    // Slide 6 — Last Exporter Data: Top 5 Competitors
    if(showExport){
      const pivot = monthlyPivot(expRows, expMapping, "exporter", 5);
      if(pivot){
        const colCount = pivot.headers.length;
        const tableW = Math.min(pptxIn(12.1), colCount * pptxIn(2.0));
        const narration = pivot.cheapest
          ? `${pivot.cheapest.name} has offered the most competitive matched export price in this window, at ${pivot.cheapest.price.toFixed(2)}${pivot.cheapest.currency?` ${pivot.cheapest.currency}`:""}.`
          : `This table lists actual shipment prices by month for our top 5 matched exporters by volume.`;
        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Last Exporter Data — Top 5 Competitors (Exporter Customs Data)", fontSize:20, bold:true, color:"FFFFFF"}),
          pptxTable({x:pptxIn(0.6), y:pptxIn(1.1), w:tableW, rowH:pptxIn(0.5), headers:pivot.headers, rows:pivot.rows}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.1)+pptxIn(0.5)*(pivot.rows.length+1)+pptxIn(0.15), w:pptxIn(11.7), h:pptxIn(0.9), text:narration, fontSize:12, color:GREY}),
        ]));
      }
    }

    // Slide 7 — Top Exporters
    if(showExport){
      const rows = pptxTopRows(expRows, expMapping, "exporter", "expcountry");
      if(rows.length){
        const expAgg = aggregateBy(expRows, expMapping.exporter, expMapping, companyKey);
        const leader = expAgg[0];
        const cheapestExp = [...expAgg].filter(([,v])=>v.priceAvg!==null).sort((a,b)=>a[1].priceAvg-b[1].priceAvg)[0];
        const narration = `${leader[0]} is the largest matched exporter by volume (${leader[1].qty.toLocaleString()} units)`
          + (cheapestExp && cheapestExp[0]!==leader[0] ? `, while ${cheapestExp[0]} offers the most competitive matched price at ${cheapestExp[1].priceAvg.toFixed(2)}${cheapestExp[1].currency?` ${cheapestExp[1].currency}`:""}` : "")
          + `.`;
        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:`Top Exporters — HS ${item.hs}`, fontSize:22, bold:true, color:"FFFFFF"}),
          pptxTable({x:pptxIn(0.6), y:pptxIn(1.2), w:pptxIn(11.5), rowH:pptxIn(0.55), headers:["Exporter","Country","Qty (MT)","Unit Price (per KG)"], rows}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.2)+pptxIn(0.55)*(rows.length+1)+pptxIn(0.2), w:pptxIn(11.7), h:pptxIn(0.9), text:narration, fontSize:13, color:GREY}),
        ]));
      }
    }

    // Slide 8 — Region-wise Comparison: Exports (by Exporting Country)
    if(showExport){
      const rows = pptxRegionRows(expRows, expMapping, "expcountry");
      if(rows.length){
        const regionAgg = aggregateBy(expRows, expMapping.expcountry, expMapping);
        const topRegion = regionAgg[0];
        const narration = `${topRegion[0]} is the dominant exporting country by volume in matched records (${topRegion[1].qty.toLocaleString()} units), averaging ${topRegion[1].priceAvg!==null?topRegion[1].priceAvg.toFixed(2):"n/a"}${topRegion[1].currency?` ${topRegion[1].currency}`:""}.`;
        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Region-wise Comparison — Exports (by Exporting Country)", fontSize:20, bold:true, color:"FFFFFF"}),
          pptxTable({x:pptxIn(0.6), y:pptxIn(1.2), w:pptxIn(10.5), rowH:pptxIn(0.55), headers:["Exporting Country","Qty","Avg Unit Price"], rows}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.2)+pptxIn(0.55)*(rows.length+1)+pptxIn(0.2), w:pptxIn(11.7), h:pptxIn(0.9), text:narration, fontSize:13, color:GREY}),
        ]));
      }
    }

function pptxLandedCostRows(rows, mapping, headers, companyRole, item){
  const { ranked, sroCols } = computeLandedCostRanking(rows, mapping, headers, companyRole, item);
  if(ranked.length===0) return null;
  const top8 = ranked.slice(0,8);
  const rows2 = top8.map(([name,lc,qty,sroList,pct],i)=>{
    const base = [String(i+1), name, fmtQtyMt(qty), `${pct.toFixed(1)}%`, fmtPricePerKg(lc)];
    if(sroCols.length) base.push(sroList.length ? sroList.join(", ") : "none listed");
    return base;
  });
  return { rows: rows2, sroCols, ranked: top8 };
}


function pptxFullMatrixRows(rows, mapping, companyRole, maxCompanies){
  const matrix = fullCompanyMonthMatrix(rows, mapping, companyRole, maxCompanies);
  if(!matrix || matrix.companies.length===0) return null;
  const months = matrix.months.slice(-6); // cap columns for slide width, same as the month-pivot slides
  const headers = [companyRole==="importer"?"Importer":"Supplier (Exporter)", ...months.map(monthLabel)];
  const bodyRows = matrix.companies.map(name => [
    name,
    ...months.map(mk => {
      const c = matrix.cell[name] && matrix.cell[name][mk];
      if(!c) return "—";
      const avg = c.weightedQty>0 ? (c.weightedSum/c.weightedQty) : (c.n?(c.sum/c.n):null);
      return `${fmtQtyMt(c.qty)} MT @ ${fmtPricePerKg(avg)}/KG`;
    })
  ]);
  return { headers, rows: bodyRows, rest: matrix.rest, totalCompanies: matrix.totalCompanies };
}


    // Slide 9 — Exporter Data Based on Selected Item (full month x supplier matrix, from import file's Supplier Name column)
    if(showImport){
      const matrix = pptxFullMatrixRows(impRows, impMapping, "supplier", 8);
      if(matrix){
        const colCount = matrix.headers.length;
        const tableW = Math.min(pptxIn(12.1), colCount * pptxIn(2.1));
        const restNote = matrix.rest>0 ? ` Showing top ${matrix.headers.length-1} of ${matrix.totalCompanies} suppliers by total quantity.` : "";
        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Exporter Data Based on Selected Item", fontSize:20, bold:true, color:"FFFFFF"}),
          pptxTable({x:pptxIn(0.6), y:pptxIn(1.1), w:tableW, rowH:pptxIn(0.5), headers:matrix.headers, rows:matrix.rows}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.1)+pptxIn(0.5)*(matrix.rows.length+1)+pptxIn(0.15), w:pptxIn(11.7), h:pptxIn(0.9), text:`Each cell: total quantity @ quantity-weighted average unit price, by month. From the "Supplier Name" column — the foreign seller is the exporter from our side as the buyer/importer.${restNote}`, fontSize:11, color:GREY}),
        ]));
      }
    }

    // Slide 10 — Importer Data Based on Selected Item (full month x importer matrix)
    if(showImport){
      const matrix = pptxFullMatrixRows(impRows, impMapping, "importer", 8);
      if(matrix){
        const colCount = matrix.headers.length;
        const tableW = Math.min(pptxIn(12.1), colCount * pptxIn(2.1));
        const restNote = matrix.rest>0 ? ` Showing top ${matrix.headers.length-1} of ${matrix.totalCompanies} importers by total quantity.` : "";
        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Importer Data Based on Selected Item", fontSize:20, bold:true, color:"FFFFFF"}),
          pptxTable({x:pptxIn(0.6), y:pptxIn(1.1), w:tableW, rowH:pptxIn(0.5), headers:matrix.headers, rows:matrix.rows}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.1)+pptxIn(0.5)*(matrix.rows.length+1)+pptxIn(0.15), w:pptxIn(11.7), h:pptxIn(0.9), text:`Each cell: total quantity @ quantity-weighted average unit price, by month. From the "Importer Name on GD" column.${restNote}`, fontSize:11, color:GREY}),
        ]));
      }
    }

    // Slide — Landed Cost Comparison (enriched: % of Volume, SRO codes, concentration risk, savings-if-switched)
    if(showImport){
      const lcResult = pptxLandedCostRows(impRows, impMapping, state.files.import?.headers, "supplier", item);
      if(lcResult){
        const { rows: landedRows, sroCols } = lcResult;
        const { ranked: fullRanked, totalQtyAllSuppliers, actualWeightedSumAll, allSuppliersByVolume } =
          computeLandedCostRanking(impRows, impMapping, state.files.import?.headers, "supplier", item);
        const cheapest = fullRanked[0];
        const lcCols = detectLandedCostColumns(state.files.import?.headers || []);
        const { formula, note: exclNote } = landedCostFormulaText(lcCols);

        let landedNarration = `${cheapest[0]} is the most cost-effective supplier once real paid duties are included, at ${fmtPricePerKg(cheapest[1])} PKR/KG. Formula: ${formula}.${exclNote}`;

        const topByVolume = allSuppliersByVolume[0];
        if(topByVolume && topByVolume[2] >= 40){
          landedNarration += ` Concentration risk: ${topByVolume[0]} accounts for ${topByVolume[2].toFixed(0)}% of matched volume — a disruption there would affect the majority of this item's supply.`;
        }
        if(fullRanked.length >= 2 && totalQtyAllSuppliers > 0){
          const blended = actualWeightedSumAll / totalQtyAllSuppliers;
          const saving = blended - cheapest[1];
          if(saving > 0.01){
            landedNarration += ` If 100% of matched volume had come from ${cheapest[0]} instead of the actual supplier mix, blended duty-paid cost would have been ${fmtPricePerKg(cheapest[1])} PKR/KG instead of ${fmtPricePerKg(blended)} — a theoretical ${fmtPricePerKg(saving*totalQtyAllSuppliers)} PKR ceiling, not a guaranteed saving.`;
          }
        }

        const headersRow = ["#","Supplier (Exporter)","Qty (MT)","% Vol","Duty-Paid Cost/KG"];
        if(sroCols.length) headersRow.push("SRO Codes");
        addSlide(pptxSlideXml([
          pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Duty-Paid Cost Comparison — Real Cost After Duties (Excludes Freight & Local Port Charges)", fontSize:20, bold:true, color:"FFFFFF"}),
          pptxTable({x:pptxIn(0.6), y:pptxIn(1.2), w:pptxIn(11.7), rowH:pptxIn(0.5), headers:headersRow, rows:landedRows}),
          pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.2)+pptxIn(0.5)*(landedRows.length+1)+pptxIn(0.2), w:pptxIn(11.7), h:pptxIn(1.6), text:landedNarration, fontSize:10.5, color:GREY}),
        ]));
      }
    }

    // Slide 12 — Price Trend (embedded chart image)
    const trendPng = drawTrendCanvasPng(impRows, expRows, witsRows, manual);
    if(trendPng){
      const trendVerb = trendDir==="Rising" ? "risen" : trendDir==="Falling" ? "fallen" : "stayed flat";
      const trendNarration = trendImp.length>=2
        ? `Import price has ${trendVerb} over the selected period, moving from ${trendImp[0].price.toFixed(2)} to ${trendImp[trendImp.length-1].price.toFixed(2)}.${(posData && posData.priceAvg!==null && !isNaN(posData.priceAvg))?" The dashed line marks our current price for direct comparison against market movement.":""}`
        : `Not enough dated price points in the selected period to establish a trend — this chart will fill in as more dated shipments are matched.`;
      addSlide(pptxSlideXml([
        pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
        pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Price Trend", fontSize:24, bold:true, color:"FFFFFF"}),
        pptxPicture({x:pptxIn(0.6), y:pptxIn(1.1), w:pptxIn(12.1), h:pptxIn(4.4)}),
        pptxTextBox({x:pptxIn(0.6), y:pptxIn(5.65), w:pptxIn(11.7), h:pptxIn(0.8), text:trendNarration, fontSize:12, color:GREY}),
      ]), "trend-chart.png");
    }

    // Slide 13 — Insights & recommendations (local, rule-based — no external calls)
    const bullets = buildInsightsBullets(item, manual, impRows, expRows, witsRows);
    addSlide(pptxSlideXml([
      pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
          pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
      pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Insights & Recommendations", fontSize:24, bold:true, color:"FFFFFF"}),
      pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.0), w:pptxIn(11.7), h:pptxIn(0.5), text:"The following points summarize our procurement position and recommended next steps, based on the matched market data above.", fontSize:13, color:GREY}),
      pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.6), w:pptxIn(11.7), h:pptxIn(4.9), fontSize:16, color:DARK, text:bullets.map(b=>"•  "+b).join("\n\n")})
    ]));

    // Slide — Remarks (manually entered notes for this item, if any)
    const remarksText = (state.remarks[item.uid] || "").trim();
    if(remarksText){
      addSlide(pptxSlideXml([
        pptxRect({x:0, y:0, w:PPTX_W, h:pptxIn(0.7), fill:NAVY}),
        pptxRect({x:0, y:pptxIn(0.7), w:PPTX_W, h:pptxIn(0.035), fill:GOLD}),
        pptxTextBox({x:pptxIn(0.6), y:pptxIn(0.15), w:pptxIn(11.5), h:pptxIn(0.5), text:"Remarks", fontSize:24, bold:true, color:"FFFFFF"}),
        pptxTextBox({x:pptxIn(0.6), y:pptxIn(1.2), w:pptxIn(11.7), h:pptxIn(5.0), fontSize:14, color:DARK, text:remarksText}),
      ]));
    }

    const zip = new JSZip();
    zip.file("[Content_Types].xml", pptxContentTypes(slides.length));
    zip.file("_rels/.rels", PPTX_ROOT_RELS);
    zip.file("docProps/core.xml", pptxCore(`${item.name} — Director Review`));
    zip.file("docProps/app.xml", pptxApp(slides.length));
    zip.file("ppt/presentation.xml", pptxPresentation(slides.length));
    zip.file("ppt/_rels/presentation.xml.rels", pptxPresentationRels(slides.length));
    zip.file("ppt/theme/theme1.xml", PPTX_THEME);
    zip.file("ppt/slideMasters/slideMaster1.xml", PPTX_SLIDE_MASTER);
    zip.file("ppt/slideMasters/_rels/slideMaster1.xml.rels", PPTX_SLIDE_MASTER_RELS);
    zip.file("ppt/slideLayouts/slideLayout1.xml", PPTX_SLIDE_LAYOUT);
    zip.file("ppt/slideLayouts/_rels/slideLayout1.xml.rels", PPTX_SLIDE_LAYOUT_RELS);
    const mediaWritten = new Set();
    slides.forEach(({xml, media}, i)=>{
      zip.file(`ppt/slides/slide${i+1}.xml`, xml);
      zip.file(`ppt/slides/_rels/slide${i+1}.xml.rels`, pptxSlideRels(media));
      if(media && !mediaWritten.has(media)){
        zip.file(`ppt/media/${media}`, dataUrlToUint8Array(trendPng));
        mediaWritten.add(media);
      }
    });

    const blob = await zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.presentationml.presentation"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${item.name.replace(/[^a-z0-9]+/gi,"_")}_director_review.pptx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch(err){
    console.error("PPT export failed", err);
    alert("Couldn't generate the PPT: " + (err.message || "unknown error"));
  }finally{
    btn.textContent = origLabel;
    btn.disabled = false;
  }
}

(async function init(){
  if(isAuthed()){
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "";
    await loadStorage();
    render();
    return;
  }
  document.getElementById("login-btn").addEventListener("click", async ()=>{
    const ok = await tryLogin();
    if(ok){ await loadStorage(); render(); }
  });
  document.getElementById("login-password").addEventListener("keydown", async (e)=>{
    if(e.key === "Enter"){
      const ok = await tryLogin();
      if(ok){ await loadStorage(); render(); }
    }
  });
})();
</script>

<style>
:root{
  --bg:#0f1318;
  --surface:#1a1f26;
  --surface-2:#232a33;
  --border:#313a45;
  --text:#e7ecf2;
  --text-dim:#8c97a6;
  --accent:#d4a755;
  --accent-dim:#8a6d38;
  --good:#4a9d84;
  --bad:#c1615a;
  --mono: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
  --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.5;
}
.wrap{max-width:1180px; margin:0 auto; padding:28px 20px 80px;}
h1{font-size:23px; letter-spacing:.01em; margin:0 0 2px; font-weight:700;}
.sub{color:var(--text-dim); font-size:12.5px; margin-bottom:22px;}
.top-row{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:12px; flex-wrap:wrap;}
button{font-family:inherit; cursor:pointer;}
.btn{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:8px 14px; border-radius:6px; font-size:12.5px; font-weight:600;
}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:700; box-shadow:0 2px 8px rgba(212,167,85,.25);}
.btn.primary:hover{background:#e2b768;}
.btn.small{padding:5px 10px; font-size:11.5px;}

.upload-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px;}
@media(max-width:820px){.upload-grid{grid-template-columns:1fr;}}
.card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.card h3{margin:0 0 3px; font-size:13px; letter-spacing:.04em; font-weight:700; text-transform:uppercase; color:var(--accent);}
.card .desc{color:var(--text-dim); font-size:11.5px; margin-bottom:12px;}
.file-status{font-size:11.5px; color:var(--text-dim); margin-top:8px; word-break:break-all;}
.file-status.loaded{color:var(--good);}
input[type=file]{display:none;}
.map-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
.map-field label{display:block; font-size:10.5px; color:var(--text-dim); margin-bottom:3px; text-transform:uppercase; letter-spacing:.03em;}
select, input[type=text], input[type=number]{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:6px 8px; border-radius:5px; font-size:12px; font-family:var(--mono);
}

.group-title{font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--text-dim); margin:22px 0 8px; border-bottom:1px solid var(--border); padding-bottom:6px;}
.item-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
.item-btn{
  background:var(--surface); border:1px solid var(--border); border-radius:7px;
  padding:9px 12px; text-align:left; color:var(--text); min-width:150px;
}
.item-btn .name{font-size:12.5px; font-weight:600; display:block;}
.item-btn .hs{font-size:10.5px; color:var(--text-dim); font-family:var(--mono); display:block; margin-top:2px;}
.item-btn:hover{border-color:var(--accent);}
.item-btn.active{background:var(--accent); border-color:var(--accent);}
.item-btn.active .name, .item-btn.active .hs{color:#1a1206;}
.item-btn.no-match{opacity:.55;}

.detail{margin-top:30px; border-top:3px solid var(--accent); padding-top:20px;}
.detail-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.detail-head h2{font-size:21px; font-weight:700; margin:0; letter-spacing:.01em;}
.detail-head .hs-tag{font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}

.section{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent-dim); border-radius:10px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.22);}

.entry-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; align-items:end;}

.entry-grid label{display:block; font-size:10.5px; color:var(--text-dim); margin-bottom:3px; text-transform:uppercase;}

.hbar{overflow-x:auto; padding-bottom:4px;}
.hbar table{border-collapse:collapse; width:100%; min-width:420px;}
.hbar th, .hbar td{border:1px solid var(--border); padding:8px 10px; text-align:center; font-size:12px;}
.hbar th{background:var(--surface-2); color:var(--text-dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.02em;}
.hbar td.price{font-family:var(--mono); font-weight:600; color:var(--accent);}
.empty-note{color:var(--text-dim); font-size:12px; font-style:italic;}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:700px){.two-col{grid-template-columns:1fr;}}
.rank-banner{
  background:var(--surface-2); border:1px solid var(--accent-dim); border-radius:8px;

.rank-banner b{color:var(--accent); font-size:15px;}
.rank-banner .note{display:block; color:var(--text-dim); font-size:11px; margin-top:4px;}

table.data-table{width:100%; border-collapse:collapse; font-size:12px;}
table.data-table th, table.data-table td{border:1px solid var(--border); padding:6px 8px; text-align:left;}
table.data-table th{background:var(--surface-2); color:var(--text-dim); font-weight:500; text-transform:uppercase; font-size:10.5px;}
table.data-table td.num{font-family:var(--mono); text-align:right;}

.warn{color:var(--bad); font-size:11px; margin-top:6px;}
.placeholder{color:var(--text-dim); font-size:13px; text-align:center; padding:40px 0; border:1px dashed var(--border); border-radius:10px; margin-top:20px;}

  .card, .section{border-color:#999;}

<script>
// ---------- Login gate ----------
// This is a static offline HTML file with no server — this gate is a basic deterrent against
// casual opening, not real security. The credential is stored as a one-way hash (not the plain
// password) so it isn't visible as readable text if someone opens this file in a text editor —
// but anyone who opens browser DevTools can still read the comparison logic. Genuine access
// control for confidential data needs server-side authentication (the Streamlit edition), not
// a file that runs entirely in the visitor's own browser.
const AUTH_HASH = "8472c5d2d8c93ab3a11f48398a8d73fdcd6c27d0dc5a2fb968dbc9243af53796";
const AUTH_SESSION_KEY = "rm-analyzer:authed";

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function tryLogin(){
  const email = document.getElementById("login-email").value.trim().toLowerCase();
  const password = document.getElementById("login-password").value;
  const hash = await sha256Hex(email + "|" + password);
  const errEl = document.getElementById("login-error");
  if(hash === AUTH_HASH){
    try{ sessionStorage.setItem(AUTH_SESSION_KEY, "1"); }catch(e){}
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "";
    return true;
  }
  errEl.style.display = "block";
  return false;
}

function isAuthed(){
  try{ return sessionStorage.getItem(AUTH_SESSION_KEY) === "1"; }catch(e){ return false; }
}

      {code:"PF-5402.4700", name:"POLYESTER FILAMENT", hs:"5402.4700", origin:"—", plant:"Downstream Conversion Products"},

  ]},
  { key:"other", label:"Other RMs", items: [
      {plant:"Novatex Plant", code:"100000225/217", name:"U1 Suspension", origin:"DE", hs:"3824.9999"},
      {plant:"Novatex Plant", code:"100000208", name:"Catalyst ATA", origin:"CN", hs:"3815.1910"},
      {plant:"Novatex Plant", code:"100001785", name:"Catalyst ATG", origin:"CN", hs:"2905.3900"},
      {plant:"Novatex Plant", code:"100000161", name:"Phosphoric Acid", origin:"JPY/DE", hs:"2809.2010"},
      {plant:"Novatex Plant", code:"100000023", name:"Blue Toner Powder (Global PRT Blue-2)", origin:"UK GB", hs:"3204.1110"},
      {plant:"Novatex Plant", code:"100000070", name:"Red Toner Powder (Global PRT Red Dispersion-2)", origin:"UK GB", hs:"3204.1120"},
      {plant:"Bopet KHI & Bopet SKP", code:"100000006", name:"Aluminium Wire", origin:"INDO/ESP", hs:"7605.1900"},
      {plant:"Bopet KHI & Bopet SKP", code:"100000941", name:"Aluminium Pellets", origin:"ESP", hs:"7605.1100"},
      {plant:"Bopet KHI & Bopet SKP", code:"100000044", name:"Snow XS Silica", origin:"JPY", hs:"2811.2200"},
      {plant:"Bopet KHI & Bopet SKP", code:"100000065", name:"Surfactant RY-3", origin:"JPY", hs:"3402.4200"},

      {plant:"Krystallite", code:"100000164-ALL", name:"HDPE (All Grades)", origin:"Various", hs:"3901.2000"},
  ]},
];

const ITEMS_BY_CATEGORY = {};
const CATEGORY_LABELS = {};
CATEGORY_DEFS.forEach(cd=>{
  cd.items.forEach((it,i)=>{
    it.uid = cd.key+"__"+i+"__"+String(it.code||it.name).replace(/[^a-z0-9]+/gi,"-");
    it.category = cd.key;
    if(!it.plant) it.plant = cd.label;
  });
  ITEMS_BY_CATEGORY[cd.key] = cd.items;
  CATEGORY_LABELS[cd.key] = cd.label;
});
const CATEGORY_KEYS = CATEGORY_DEFS.map(cd=>cd.key);

function allItems(){
  return CATEGORY_KEYS.flatMap(k => [...ITEMS_BY_CATEGORY[k], ...(state.customItems[k]||[])]);
}
function findItem(uid){ return allItems().find(i=>i.uid===uid); }

const FILE_TYPES = [
  {key:"import", label:"Import Customs Data", desc:"Pakistan Customs import declarations (your company's imports)",
    roles:[["hs","HS Code"],["desc","Item Description"],["gd","GD Number"],["importer","Importer / Consignee"],["supplier","Supplier / Exporter"],["origin","Country of Origin"],["qty","Quantity"],["price","Unit Price"],["currency","Currency"],["date","Date"]]},
  {key:"export", label:"Exporter Customs Data", desc:"Customs data for exporters shipping this HS code (competing suppliers)",
    roles:[["hs","HS Code"],["desc","Item Description"],["gd","GD Number"],["exporter","Exporter Name"],["expcountry","Exporting Country"],["buyer","Buyer / Consignee"],["qty","Quantity"],["price","Unit Price"],["currency","Currency"],["date","Date"]]},
  {key:"wits", label:"Global WITS Data", desc:"World Bank WITS / Comtrade trade statistics by HS heading",
    roles:[["hs","HS Code"],["desc","Item Description"],["reporter","Reporter Country"],["partner","Partner Country"],["flow","Trade Flow (import/export)"],["qty","Quantity"],["price","Unit Price"],["currency","Currency"],["year","Year"]]},
];

function emptyPerCategory(){ const o={}; CATEGORY_KEYS.forEach(k=>o[k]=[]); return o; }
// ---------- Storage backend ----------
// window.storage (persistent artifact storage) only exists when this file is rendered as a
// live Claude.ai artifact. When opened as a downloaded/standalone .html file in a browser,
// window.storage is undefined and every save silently no-ops — which is why data appeared to
// "reset to zero" on reopen. This wrapper tries window.storage first, and transparently falls
// back to IndexedDB (no realistic per-key size cap) so saves persist either way — including real
// customs files that can run 100+ MB as JSON, which both window.storage (documented 5MB/key cap)
// and localStorage (typically 5-10MB total) silently reject outright.
const LS_PREFIX = "rm-analyzer:";
const ARTIFACT_STORAGE_LIMIT_BYTES = 4.5 * 1024 * 1024; // stay under the documented 5MB/key cap
const hasArtifactStorage = (typeof window !== "undefined") && !!window.storage && typeof window.storage.get === "function";

function byteSize(value){
  try{ return new Blob([value]).size; }catch(e){ return String(value||"").length * 2; }
}

function lsGet(key){
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw !== null ? { key, value: raw } : null;
  }catch(e){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, value); return { key, value }; }
  catch(e){ return null; }
}
function lsDelete(key){
  try{ localStorage.removeItem(LS_PREFIX+key); return { key, deleted:true }; }
  catch(e){ return null; }
}

const IDB_NAME = "rm-analyzer-db";
const IDB_STORE = "kv";
let idbOpenPromise = null;
function openIdb(){
  if(idbOpenPromise) return idbOpenPromise;
  idbOpenPromise = new Promise((resolve, reject)=>{
    if(typeof indexedDB === "undefined"){ reject(new Error("indexedDB unavailable")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return idbOpenPromise;
}
async function idbGet(key){
  try{
    const db = await openIdb();
    return await new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=> resolve(req.result!==undefined ? { key, value:req.result } : null);
      req.onerror = ()=> resolve(null);
    });
  }catch(e){ return null; }
}
async function idbSet(key, value){
  try{
    const db = await openIdb();
    return await new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=> resolve({ key, value });
      tx.onerror = ()=> resolve(null);
    });
  }catch(e){ return null; }
}
async function idbDelete(key){
  try{
    const db = await openIdb();
    return await new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = ()=> resolve({ key, deleted:true });
      tx.onerror = ()=> resolve(null);
    });
  }catch(e){ return null; }
}

const storageBackend = {
  async get(key, shared){
    if(hasArtifactStorage){
      try{ const r = await window.storage.get(key, shared); if(r) return r; }catch(e){ /* fall through */ }
    }
    const idbResult = await idbGet(key);
    if(idbResult) return idbResult;
    return lsGet(key);
  },
  async set(key, value, shared){
    const size = byteSize(value);
    let result = null;
    // skip window.storage entirely for payloads that would just be rejected by its documented cap —
    // no point burning a round trip (or risking a thrown quota error) on a call that can't succeed
    if(hasArtifactStorage && size < ARTIFACT_STORAGE_LIMIT_BYTES){
      try{ result = await window.storage.set(key, value, shared); }catch(e){ result = null; }
    }
    if(result) return result;
    const idbResult = await idbSet(key, value); // no realistic size cap — handles large customs files
    if(idbResult) return idbResult;
    return lsSet(key, value); // last-resort fallback for small values only
  },
  async delete(key, shared){
    if(hasArtifactStorage){
      try{ await window.storage.delete(key, shared); }catch(e){ /* ignore */ }
    }
    await idbDelete(key);
    return lsDelete(key);
  }
};

// ---------- SharePoint / Microsoft 365 integration ----------
// Real values from the user's Entra ID app registration — these are safe to be public
// (Client ID and Tenant ID are not secrets; SPA apps have no client secret at all).
const MSAL_CONFIG = {
  auth: {
    clientId: "912a9b6c-b48b-4793-bc7e-9f71f8b95a76",
    authority: "https://login.microsoftonline.com/0a796a08-f4fc-4258-8392-0e7e39c8f54f",
    redirectUri: window.location.origin + window.location.pathname,
  },
  cache: { cacheLocation: "sessionStorage" },
};
const GRAPH_SCOPES = ["Files.Read.All", "Sites.Read.All"];
let msalInstance = null;
let spAccessToken = null;

function getMsalInstance(){
  if(!msalInstance) msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  return msalInstance;
}

// Signs the user in (popup) and returns a valid Graph API access token — reuses a cached
// silent token when possible so this doesn't re-prompt every single time.
async function ensureSharePointSignedIn(){
  const app = getMsalInstance();
  await app.initialize();
  const accounts = app.getAllAccounts();
  const account = accounts[0];
  if(account){
    try{
      const result = await app.acquireTokenSilent({ scopes: GRAPH_SCOPES, account });
      spAccessToken = result.accessToken;
      return spAccessToken;
    }catch(e){ /* falls through to interactive sign-in below */ }
  }
  const result = await app.loginPopup({ scopes: GRAPH_SCOPES });
  spAccessToken = result.accessToken;
  return spAccessToken;
}

// Encodes any SharePoint/OneDrive sharing URL into the Microsoft Graph "shares" ID format,
// the standard documented way to resolve a plain sharing link into an actual Graph driveItem
// reference (driveId + itemId) usable for listing/reading content.
function encodeSharingUrl(sharingUrl){
  const base64 = btoa(unescape(encodeURIComponent(sharingUrl)))
    .replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
  return "u!" + base64;
}

async function graphFetch(path, token){
  const resp = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    headers: { "Authorization": `Bearer ${token}` }
  });
  if(!resp.ok){
    const body = await resp.text().catch(()=>"");
    throw new Error(`Graph API ${resp.status}: ${body.slice(0,300)}`);
  }
  return resp.json();
}

// Resolves the configured folder sharing URL to its real driveId+itemId, then lists its
// immediate file children (folders are shown but not recursed into, keeping this predictable).
async function listSharePointFolder(folderSharingUrl, token){
  const encoded = encodeSharingUrl(folderSharingUrl);
  const folderItem = await graphFetch(`/shares/${encoded}/driveItem?$select=id,name,folder,parentReference`, token);
  if(!folderItem.folder){
    throw new Error(`That link doesn't point to a folder — got "${folderItem.name}" instead. Please paste a folder link, not a file link.`);
  }
  const driveId = folderItem.parentReference.driveId;
  const children = await graphFetch(`/drives/${driveId}/items/${folderItem.id}/children?$select=id,name,size,file,folder,lastModifiedDateTime&$orderby=name`, token);
  return { driveId, items: children.value || [] };
}

// Fetches a specific file's raw bytes from SharePoint via Graph API.
async function fetchSharePointFileBytes(driveId, itemId, token){
  const resp = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/content`, {
    headers: { "Authorization": `Bearer ${token}` }
  });
  if(!resp.ok) throw new Error(`Couldn't download the file (HTTP ${resp.status}).`);
  return resp.arrayBuffer();
}

// Takes a file already fetched from SharePoint (name + raw bytes) and runs it through the
// EXACT SAME parsing + merge pipeline as a manually-uploaded file — so everything downstream
// (matching, ranking, Company View, PPT) works completely unchanged regardless of source.
async function importSharePointFile(key, fileName, arrayBuffer){
  const ext = fileName.split(".").pop().toLowerCase();
  const existing = state.files[key];
  const isDuplicate = existing && existing.uploads.some(u => u.fileName === fileName && u.size === arrayBuffer.byteLength);
  if(isDuplicate){
    state.uploadNotice[key] = { type:"dup", text:`"${fileName}" is already uploaded — skipped so data isn't duplicated.` };
    render();
    return;
  }
  let newHeaders, newRows;
  if(ext === "xlsx" || ext === "xls"){
    const wb = XLSX.read(arrayBuffer, {type:"array"});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    newRows = XLSX.utils.sheet_to_json(sheet, {defval:""});
    const headerRow = XLSX.utils.sheet_to_json(sheet, {header:1})[0] || [];
    newHeaders = headerRow.filter(h => h !== "" && h !== undefined).map(String);
  } else {
    const text = new TextDecoder().decode(arrayBuffer);
    const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
    newHeaders = parsed.meta.fields || [];
    newRows = parsed.data;
  }
  const fakeFile = { name: fileName, size: arrayBuffer.byteLength };
  await mergeUpload(key, fakeFile, newHeaders, newRows);
}

async function loadStorage(){
  for(const ft of FILE_TYPES){
    try{
      const r = await storageBackend.get("file:"+ft.key, false);
      if(r && r.value){
        const rec = JSON.parse(r.value);
        if(rec){
          // migrate old single-upload records (no .uploads history) into the cumulative format
          if(!rec.uploads){
            rec.uploads = rec.fileName ? [{ fileName: rec.fileName, size: null, uploadedAt: new Date().toISOString(), rowCount: rec.rows.length }] : [];
          }
          // retroactively tag rows from uploads made before per-upload removal existed — rows
          // were always appended in upload order, and each upload's rowCount was recorded, so
          // the boundaries can be reconstructed safely. Only do this if the counts actually add
          // up to the total; if they don't (data touched some other way), leave it alone rather
          // than guess wrong and risk misassigning rows to the wrong upload.
          const needsMigration = rec.uploads.some(u=>!u.id);
          if(needsMigration){
            const sumCounts = rec.uploads.reduce((a,u)=>a+(u.rowCount||0), 0);
            if(sumCounts === rec.rows.length){
              let cursor = 0;
              rec.uploads.forEach(u=>{
                if(!u.id){
                  u.id = `legacy_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
                  for(let i=cursor; i<cursor+(u.rowCount||0); i++){
                    if(rec.rows[i]) rec.rows[i]._uploadId = u.id;
                  }
                }
                cursor += (u.rowCount||0);
              });
              await saveFile(ft.key, rec);
            }
          }
          state.files[ft.key] = rec;
        }
      }
    }catch(e){ /* nothing stored yet */ }
  }
  try{
    const r = await storageBackend.get("manual:all", false);
    if(r && r.value) state.manual = JSON.parse(r.value);
  }catch(e){}
  try{
    const r = await storageBackend.get("our-company-name", false);
    if(r && r.value) state.ourCompanyName = r.value;
  }catch(e){}
  try{
    const r = await storageBackend.get("remarks:all", false);
    if(r && r.value) state.remarks = JSON.parse(r.value);
  }catch(e){}
  for(const cat of CATEGORY_KEYS){
    try{
      const r = await storageBackend.get("custom-items:"+cat, false);
      if(r && r.value) state.customItems[cat] = JSON.parse(r.value);
    }catch(e){ /* none added yet */ }
    try{
      const r = await storageBackend.get("removed-items:"+cat, false);
      if(r && r.value) state.removedItems[cat] = JSON.parse(r.value);
    }catch(e){ /* none removed yet */ }
  }
  try{
    const r = await storageBackend.get("hs-overrides", false);
    if(r && r.value) state.hsOverrides = JSON.parse(r.value);
  }catch(e){ /* none set yet */ }
  applyHsOverrides();
}

async function fetchOilPrice(benchmark, apiKey){
  const resp = await fetch(`https://api.api-ninjas.com/v1/oilprice?type=${benchmark}`, {
    headers: { "X-Api-Key": apiKey }
  });
  if(!resp.ok) throw new Error(`API error ${resp.status}`);

async function checkOilMarket(holder){
  let apiKey = getApiNinjasKey();
  if(!apiKey){
    holder.innerHTML = `
      <div class="empty-note" style="margin-bottom:6px;">Needs a free API Ninjas key (api-ninjas.com — sign up, no card needed) — enter it once, it's remembered in this browser only.</div>
      <input type="text" id="oil-api-key-input" placeholder="Paste your API Ninjas key here" style="width:70%; max-width:320px;">
      <button class="btn small" id="oil-api-key-save">Save key</button>
    `;
    holder.querySelector("#oil-api-key-save").addEventListener("click", ()=>{
      const val = holder.querySelector("#oil-api-key-input").value.trim();
      if(val){ setApiNinjasKey(val); checkOilMarket(holder); }
    });
    return;
  }
  holder.innerHTML = `<div class="empty-note">Fetching live oil prices…</div>`;
  try{
    const [wti, brent] = await Promise.all([fetchOilPrice("wti", apiKey), fetchOilPrice("brent", apiKey)]);
    const lines = [["WTI Crude", wti], ["Brent Crude", brent]].map(([label, d])=>{
      if(!d || d.price===undefined) return `<div>${escHtml(label)}: no data returned</div>`;
      let changeNote = "";
      if(d.previous_close){
        const pct = (d.price - d.previous_close) / d.previous_close * 100;
        const arrow = pct>0 ? "▲" : pct<0 ? "▼" : "—";
        changeNote = ` (${arrow} ${Math.abs(pct).toFixed(1)}% vs previous close)`;
      }
      return `<div><strong>${escHtml(label)}</strong>: $${d.price.toFixed(2)}/barrel${changeNote}</div>`;
    });
    holder.innerHTML = lines.join("");
  }catch(e){
    holder.innerHTML = `<div class="warn">Couldn't fetch live oil prices (${escHtml(e.message)}). Check your API key is correct, or try again shortly.
      <button class="btn small" id="oil-api-key-reset" style="margin-left:8px;">Change key</button></div>`;
    holder.querySelector("#oil-api-key-reset").addEventListener("click", ()=>{ setApiNinjasKey(""); checkOilMarket(holder); });
  }
}

}

async function handleUpload(key, e){
  const file = e.target.files[0];
  if(!file) return;
  const ext = file.name.split(".").pop().toLowerCase();

  // duplicate check: same filename + same size already recorded for this file type
  const existing = state.files[key];
  const isDuplicate = existing && existing.uploads.some(u => u.fileName === file.name && u.size === file.size);
  if(isDuplicate){
    state.uploadNotice[key] = { type:"dup", text:`"${file.name}" is already uploaded — skipped so data isn't duplicated. Upload a different file to add more.` };
    e.target.value = "";
    render();
    return;
  }

  let newHeaders, newRows;
  if(ext === "xlsx" || ext === "xls"){
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    newRows = XLSX.utils.sheet_to_json(sheet, {defval:""});
    const headerRow = XLSX.utils.sheet_to_json(sheet, {header:1})[0] || [];
    newHeaders = headerRow.filter(h => h !== "" && h !== undefined).map(String);
  } else {
    const parsed = await new Promise(resolve=>{
      Papa.parse(file, { header:true, skipEmptyLines:true, complete: res=>resolve(res) });
    });
    newHeaders = parsed.meta.fields || [];
    newRows = parsed.data;
  }

  mergeUpload(key, file, newHeaders, newRows);
  e.target.value = "";
}

async function mergeUpload(key, file, newHeaders, newRows){
  const rec = state.files[key] || { mapping:{}, headers:[], rows:[], uploads:[] };
  rec.headers = [...new Set([...(rec.headers||[]), ...newHeaders])]; // union, keep discovering new columns
  const uploadId = `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  newRows.forEach(r => { r._uploadId = uploadId; }); // tags each row with its source upload, so a single month can be removed later without clearing everything
  rec.rows = [...(rec.rows||[]), ...newRows];
  rec.uploads = [...(rec.uploads||[]), { id:uploadId, fileName:file.name, size:file.size, uploadedAt:new Date().toISOString(), rowCount:newRows.length }];

  state.uploadNotice[key] = { type:"ok", text:`Added ${newRows.length.toLocaleString()} rows from "${file.name}". Total now: ${rec.rows.length.toLocaleString()} rows across ${rec.uploads.length} upload${rec.uploads.length===1?"":"s"}.` };

  await saveFile(key, rec);
  render();
}

async function removeUpload(key, uploadId){
  const rec = state.files[key];
  if(!rec) return;
  const target = rec.uploads.find(u=>u.id===uploadId);
  if(!target) return;
  if(!window.confirm(`Remove "${target.fileName}" (${target.rowCount.toLocaleString()} rows)? Everything else you've uploaded for this file stays.`)) return;
  rec.rows = rec.rows.filter(r => r._uploadId !== uploadId);
  rec.uploads = rec.uploads.filter(u => u.id !== uploadId);
  state.uploadNotice[key] = { type:"ok", text:`Removed "${target.fileName}". Total now: ${rec.rows.length.toLocaleString()} rows across ${rec.uploads.length} upload${rec.uploads.length===1?"":"s"}.` };
  await saveFile(key, rec);
  render();
}

async function clearFileData(key){
  if(!window.confirm(`Clear all stored data for "${FILE_TYPES.find(f=>f.key===key).label}"? This removes every uploaded row for this file type — you'll need to re-upload from scratch.`)) return;
  state.files[key] = null;
  state.uploadNotice[key] = null;
  try{ await storageBackend.delete("file:"+key, false); }catch(e){ /* nothing stored, or already cleared */ }
  render();
}

async function saveFile(key, rec){
  state.files[key] = rec;
  try{
    const result = await storageBackend.set("file:"+key, JSON.stringify(rec), false);
    if(!result){
      const warnEl = document.querySelector(`#file-${key}`)?.closest(".card")?.querySelector("[data-warn]");
      if(warnEl){ warnEl.style.display="block"; warnEl.textContent = "File loaded for this session but is too large to persist — you'll need to re-upload next time."; }
    }
  }catch(err){
    console.error("storage set failed", err);
  }
}

// ---- matching helpers ----
// Pakistan Customs HS codes are always 8 digits. Excel often stores them as numbers and drops
// trailing zeros (e.g. "3907.6990" displays as "3907.699") — pad up to the target precision to
// restore that, rather than truncating the comparison down dynamically.
// Global WITS/Comtrade data is only ever 6-digit heading-level — comparing it at 8 digits would
// pad it with two false zeros, so WITS matching is called with precision=6 instead.
function normalizeHs(code, precision){
  const digits = String(code||"").replace(/[^0-9]/g,"");
  if(!digits) return "";
  return digits.length >= precision ? digits.slice(0,precision) : digits.padEnd(precision,"0");
}

function hsMatch(rowHs, itemHs, precision=8){
  const a = normalizeHs(rowHs, precision);
  const b = normalizeHs(itemHs, precision);
  if(!a || !b) return false;
  return a === b;
}

function parseDate(v){
  if(v===undefined||v===null||v==="") return null;
  if(v instanceof Date) return v;
  if(typeof v === "number"){ // Excel serial date
    const d = new Date(Math.round((v-25569)*86400*1000));
    return isNaN(d.getTime()) ? null : d;
  }
  let d = new Date(v);
  if(!isNaN(d.getTime())) return d;
  const m = String(v).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){
    let [, a, b, y] = m;
    if(y.length===2) y = "20"+y;
    d = new Date(`${y}-${b}-${a}`); // assume DD/MM/YYYY (common in PK customs data)
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}

function rowDate(row, mapping){
  if(mapping.date){
    const d = parseDate(row[mapping.date]);
    if(d) return d;
  }
  if(mapping.year){
    const y = parseInt(row[mapping.year], 10);
    if(!isNaN(y)) return new Date(y, 0, 1);
  }
  if(mapping.gd){
    const d = extractDateFromGD(row[mapping.gd]);
    if(d) return d;
  }
  return null;
}

// Pakistan customs GD numbers often end in a DD-MM-YYYY date (e.g. "KAPW-HC-221430-23-06-2026")
function extractDateFromGD(v){
  if(!v) return null;
  const m = String(v).match(/(\d{2})-(\d{2})-(\d{4})/);
  if(!m) return null;
  const [, dd, mm, yyyy] = m;
  const d = new Date(`${yyyy}-${mm}-${dd}`);
  return isNaN(d.getTime()) ? null : d;
}

// GD Number format e.g. "KAPW-HC-210379-04-06-2026" — the segment right after the port/
// collectorate code identifies the clearance scheme. HC = Home Consumption (normal duty-paid
// clearance); FS = under the Export Facilitation Scheme (duty-exempt, for goods that will be
// re-exported). Real customs data also has ~12 other scheme codes (TP, EB, IB, etc.) — the
// filter buttons only isolate HC/FS specifically; leaving both off shows everything, including
// those other schemes, so nothing is silently hidden by default.
function extractGdSchemeCode(v){
  if(!v) return null;
  const m = String(v).match(/^[A-Z]+-([A-Z]+)-/);
  return m ? m[1] : null;
}

function passesSchemeFilter(row, mapping){
  const filter = state.gdSchemeFilter;
  if(!filter || (!filter.dutyPaid && !filter.efs)) return true; // no filter active — show everything
  if(!mapping.gd) return true; // can't classify without a GD Number column mapped — don't hide data over it
  const code = extractGdSchemeCode(row[mapping.gd]);
  if(filter.dutyPaid && code === "HC") return true;
  if(filter.efs && code === "FS") return true;
  return false;
}

function inPeriodDate(d, period, from, to){
  if(period === "all") return true;
  const now = new Date();
  const monthsAgo = (now - d) / (1000*60*60*24*30.44);
  switch(period){
    case "0-6": return monthsAgo>=0 && monthsAgo<=6;
    case "6-12": return monthsAgo>6 && monthsAgo<=12;
    case "0-12": return monthsAgo>=0 && monthsAgo<=12;
    case "12-24": return monthsAgo>12 && monthsAgo<=24;
    case "custom":
      if(from && d < new Date(from)) return false;
      if(to && d > new Date(to)) return false;
      return true;
    default: return true;
  }
}

function passesPeriod(row, mapping){
  if(state.period === "all") return true;
  const d = rowDate(row, mapping);
  if(!d) return true; // can't determine date — don't drop the row, just can't confirm it's in range
  return inPeriodDate(d, state.period, state.periodFrom, state.periodTo);
}

function normWords(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2);
}

function compact(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }

// Merges company-name variants that are almost certainly the same entity (punctuation differences,
// a trailing legal suffix present in one filing and missing in another, an address fragment tacked
// on after the legal name) into one canonical grouping key. Deliberately conservative — only strips
// legal-entity words and clear trailing address junk (has a digit, or 2+ trailing words); anything
// else stays untouched so different companies never get merged into one figure.
const PERIOD_OPTIONS = [
  ["all","All time"],["0-6","0–6 months"],["6-12","6–12 months"],
  ["0-12","Last 12 months"],["12-24","12–24 months ago"],["custom","Custom range"]
];

const LEGAL_SUFFIX_WORDS = new Set([
  "LIMITED","LTD","LLC","INC","CORPORATION","CORP","CO","COMPANY","PLC","GMBH","SRL","FZCO",
  "GROUP","PVT","PRIVATE","PUBLIC","SA","NV","BV","AG"
]);

// Parenthetical text that is a LOCATION or generic business-type qualifier, not a company
// identity — these are shared by many unrelated companies (verified directly against real data:
// "(THAILAND)" is shared by Mitsui, Toyota, Honda; "(PAKISTAN)" is shared by Colgate-Palmolive,
// Philip Morris, Abbott, Tetra Pak, Honda Atlas — all genuinely different companies), so these
// must never be used as a merge signal the way a genuine company abbreviation (like "SABIC") can.
const NON_IDENTITY_PARENTHETICALS = new Set([
  // countries / regions (broad list — a missed one here is a real false-merge risk)
  "PAKISTAN","THAILAND","CHINA","SINGAPORE","MALAYSIA","VIETNAM","UK","USA","JAPAN","KOREA",
  "INDIA","INDONESIA","TAIWAN","HONGKONG","HONG KONG","HK","ASIA","SEA","EUROPE","GERMANY",
  "FRANCE","ITALY","SPAIN","TURKEY","UAE","SAUDI","QATAR","OMAN","BAHRAIN","KUWAIT","EGYPT",
  "BANGLADESH","SRI LANKA","NEPAL","AFGHANISTAN","IRAN","IRAQ","JORDAN","LEBANON","SYRIA",
  "CANADA","MEXICO","BRAZIL","ARGENTINA","AUSTRALIA","NEWZEALAND","RUSSIA","POLAND","NETHERLANDS",
  "BELGIUM","SWITZERLAND","SWEDEN","NORWAY","DENMARK","FINLAND","AUSTRIA","PORTUGAL","GREECE",
  "PHILIPPINES","MYANMAR","CAMBODIA","LAOS","BRUNEI","MONGOLIA","KAZAKHSTAN","UZBEKISTAN",
  // Pakistani cities — this data is full of local branch/importer designations
  "KARACHI","LAHORE","ISLAMABAD","FAISALABAD","RAWALPINDI","MULTAN","PESHAWAR","QUETTA","SIALKOT",
  // Chinese provinces / major business cities — very commonly appended as branch qualifiers
  "SHANGHAI","BEIJING","SHENZHEN","GUANGZHOU","TIANJIN","QINGDAO","NINGBO","JIANGSU","ZHEJIANG",
  "SHANDONG","GUANGDONG","HUBEI","HEBEI","FUJIAN","SUZHOU","HANGZHOU","CHANGZHOU","HUIZHOU",
  "WUHAN","DONGGUAN","XIAMEN","CHENGDU","ZHUHAI","JIAXING","NANJING","FOSHAN","KUNSHAN",
  "NANTONG","JINAN","MAOMING","LIAOCHENG","TIANMEN","DONGYING","JUXIAN","SHENGEN",
  // generic business-structure qualifiers, not identity
  "GROUP","PVT","PRIVATE","PTE","FZE","FZC","LTD","LLC","INC","CO","CORP","LIMITED","HOLDING","HOLDINGS",
  "INTERNATIONAL","TRADING","INDUSTRIES","INDUSTRY","OLDBURY","PUBLIC","COMPANY","ENTERPRISE","ENTERPRISES",
]);

function normalizeCompanyName(raw){
  if(!raw) return "";
  const rawStr = String(raw);

  // A parenthetical abbreviation (e.g. "(SABIC)", "(BASF)") is a far more typo-resistant identity
  // signal than the full descriptive name around it — real data has the same company spelled
  // "SAUDI BASIC INDUSTRIES CORPORATION" and "SAUDI BASIC INDUSTIRES CORPORATION" (typo) and
  // "SAUDI BASIC INDUSTRIAL CORPORATION" (different word) across 40+ variants, but "(SABIC)"
  // itself stays consistent. Only used when the parenthetical isn't a location/generic qualifier
  // (see NON_IDENTITY_PARENTHETICALS) — those are shared by many unrelated companies and would
  // cause false merges, unlike a genuine company abbreviation.
  const abbrevMatch = rawStr.match(/\(([A-Z0-9 ]{2,12})\)/i)
    || rawStr.match(/\b([A-Z]{3,10})\)/)
    || rawStr.match(/\b([A-Z]{3,10})\s+P\.?\s?O\.?\s?B/i); // bare abbreviation right before a P.O./address marker — same structural position as the parenthetical cases, just missing the parens entirely
  if(abbrevMatch && !NON_IDENTITY_PARENTHETICALS.has(abbrevMatch[1].toUpperCase().trim())){
    return "ABBR:" + abbrevMatch[1].toUpperCase().trim();
  }

  let s = rawStr.toUpperCase().replace(/[.,()]/g, " ").replace(/\s+/g, " ").trim();
  let words = s.split(" ").filter(Boolean);
  if(words.length === 0) return "";

  let lastSuffixIdx = -1;
  words.forEach((w,i)=>{ if(LEGAL_SUFFIX_WORDS.has(w)) lastSuffixIdx = i; });
  if(lastSuffixIdx >= 0){
    const trailing = words.slice(lastSuffixIdx+1);
    if(trailing.length>0 && (trailing.some(w=>/\d/.test(w)) || trailing.length>=2)){
      words = words.slice(0, lastSuffixIdx+1); // drop obvious trailing address text
    }
  }

  const core = words.filter(w=>!LEGAL_SUFFIX_WORDS.has(w)).join(" ");
  return core || words.join(" ");
}

// Grouping key used everywhere a row is bucketed by company name — normalized, with a safe fallback.
function companyKey(rawName){
  const norm = normalizeCompanyName(rawName);
  return norm || String(rawName || "(unnamed)");
}

// tokens containing both a letter and a digit — these are grade/model codes (e.g. "WB-630", "CC0275L")
// and are the distinguishing part of an item name, not the generic commodity words around them.
function extractCodeTokens(name){
  return String(name||"").split(/\s+/).filter(tok => /[a-zA-Z]/.test(tok) && /[0-9]/.test(tok)).map(compact).filter(Boolean);
}

// Words too generic to anchor a match on their own — "Film Grade Resin" is composed entirely of
// these, so a customs row like "Polypropylene Resin Film Grade" (wrong polymer entirely) still
// scored a perfect word-overlap match. If an item name has no word outside this list, word-overlap
// matching is unsafe and only an exact compact-phrase match (or HS Code, via the union) should count.
const GENERIC_MATCH_WORDS = new Set([
  "grade","resin","film","chip","chips","type","additive","additives","compound","compounds",
  "material","materials","raw","product","products","industrial","technical","powder","granule",
  "granules","pellet","pellets","synthetic","polymer","chemical","chemicals","general","plastic","plastics"
]);

function descScore(itemName, rowDesc){
  const codeTokens = extractCodeTokens(itemName);
  if(codeTokens.length){
    // grade code present: every code token must appear (as a substring) in the row description — exact, not fuzzy
    const rowCompact = compact(rowDesc);
    return codeTokens.every(ct => rowCompact.includes(ct)) ? 1 : 0;
  }
  // spacing/punctuation can vary between our item list and customs data (e.g. "MONO ETHYLENE" vs
  // "MONOETHYLENE") — a compact (whitespace/punctuation-stripped) containment match catches that.
  // Only checks row-contains-item (our specific item name appearing inside a longer/more detailed
  // customs description) — NOT the reverse. The reverse direction (item-contains-row) let short,
  // generic descriptions falsely match: a customs entry worded simply "RESIN" was matching "Film
  // Grade Resin" because "resin" is trivially a substring of "filmgraderesin". Verified every
  // previously-established match case (WB-630, MONO ETHYLENE) only ever needed the forward
  // direction, so removing the reverse direction fixes the false positive with no regression risk.
  const itemCompact = compact(itemName);
  const rowCompact = compact(rowDesc);
  if(itemCompact.length >= 4 && rowCompact.includes(itemCompact)){
    return 1;
  }
  const itemWords = [...new Set(normWords(itemName))];
  if(itemWords.length === 0) return 0;

  const distinctiveWords = itemWords.filter(w => !GENERIC_MATCH_WORDS.has(w));
  if(distinctiveWords.length === 0){
    // every word in the item name is a generic descriptor (no product-specific anchor) — word-overlap
    // would match any unrelated product phrased with the same generic terms. Already tried the exact
    // compact-phrase match above and it failed, so there's no safe description match here; rely on HS Code.
    return 0;
  }

  // no grade code in the item name — require ALL significant words to appear (not just a majority)
  const rowWords = new Set(normWords(rowDesc));
  const hits = itemWords.filter(w => rowWords.has(w)).length;
  return hits / itemWords.length;
}

const DESC_MATCH_THRESHOLD = 0.999; // effectively "all significant words / all code tokens must match"

// Cache of each catalog item's total matched qty across the FULL import dataset (all suppliers,
// all importers) — the denominator for "% of Pakistan's market for this item." Computing this is
// the expensive part (scanning 100k+ rows against ~30 catalog items, ~30+ seconds measured on
// real data) — but it doesn't depend on which supplier is being profiled, so it's built once and
// reused for every subsequent supplier lookup, instead of repeating the full scan every time.
let catalogTotalsCache = null;
let catalogTotalsCacheKey = null;

function buildCatalogTotals(){
  const f = state.files.import;
  if(!f || !f.mapping) return {};
  const cacheKey = f.rows.length + "|" + (f.uploads?.length||0);
  if(catalogTotalsCache && catalogTotalsCacheKey === cacheKey) return catalogTotalsCache;

  const totals = {};
  allItems().forEach(catItem=>{
    const matched = rowsForItem("import", catItem, "hs");
    const qty = matched.reduce((a,r)=>a+(num(r[f.mapping.qty])||0), 0);
    totals[catItem.hs] = { qty, rows: matched };
  });
  catalogTotalsCache = totals;
  catalogTotalsCacheKey = cacheKey;
  return totals;
}

// For a given supplier, shows every OTHER item in the Gatronova catalog they also supply to
// Pakistan (any importer, not just us) — qty, % share of that item's total matched Pakistan
// volume, origin(s), and weighted avg price. Surfaces sourcing diversification opportunities:
// a supplier we currently only buy PTA from might be a real player in MEG too.
function supplierCrossItemProfile(supplierName, excludeHs){
  const f = state.files.import;
  if(!f || !f.mapping || !f.mapping.supplier) return [];
  const supplierCol = f.mapping.supplier;
  const supplierKeyVal = companyKey(supplierName);
  const supplierRows = f.rows.filter(r => companyKey(r[supplierCol]) === supplierKeyVal);
  if(supplierRows.length === 0) return [];

  const totals = buildCatalogTotals();
  const results = [];
  allItems().forEach(catItem=>{
    if(catItem.hs === excludeHs) return;
    const hsCol = f.mapping.hs, descCol = f.mapping.desc;
    const itemMatches = supplierRows.filter(r=>{
      const descOk = descCol && descScore(catItem.name, r[descCol]) >= DESC_MATCH_THRESHOLD;
      const hsOk = hsCol && hsMatch(r[hsCol], catItem.hs, 8);
      return descOk || hsOk;
    });
    if(itemMatches.length === 0) return;

    let qty = 0, weightedSum = 0, n = 0, priceSum = 0;
    const origins = new Set();
    const importers = {}; // importer name -> qty bought, so we can show who's buying it, not just where it's from
    itemMatches.forEach(r=>{
      const q = num(r[f.mapping.qty]);
      const p = num(r[f.mapping.price]);
      if(!isNaN(q)) qty += q;
      if(!isNaN(p)){ n++; priceSum += p; if(!isNaN(q)) weightedSum += p*q; }
      if(f.mapping.origin && r[f.mapping.origin]) origins.add(String(r[f.mapping.origin]).trim());
      if(f.mapping.importer && r[f.mapping.importer]){
        const impName = String(r[f.mapping.importer]).trim();
        const impKey = companyKey(impName);
        if(!importers[impKey]) importers[impKey] = { name: impName, qty: 0 };
        if(!isNaN(q)) importers[impKey].qty += q;
      }
    });
    const avgPrice = qty>0 && weightedSum ? weightedSum/qty : (n?priceSum/n:null);
    const marketQty = totals[catItem.hs]?.qty || 0;
    const importerList = Object.values(importers).sort((a,b)=>b.qty-a.qty);
    results.push({
      itemName: catItem.name, itemHs: catItem.hs, qty, avgPrice,
      origins: [...origins], pctOfMarket: marketQty>0 ? (qty/marketQty*100) : null,
      shipments: itemMatches.length, importers: importerList,
    });
  });
  return results.sort((a,b)=>b.qty-a.qty);
}

// Core matching logic, extracted so it can run against either the full dataset (normal use)
// or a pre-filtered subset (Company View's optimization — filter to one company's rows FIRST,
// a cheap single pass, then run this same matching against that much smaller set per item,
// instead of re-scanning the whole dataset per item). Filtering by company first and matching
// item criteria second produces identical results to the reverse order, just far faster when
// checking many items against one company.
function matchItemInRows(rowsToSearch, item, mapping, hsCol, fileKey){
  const descCol = mapping.desc;
  const byDesc = new Set();
  if(descCol){
    rowsToSearch.forEach(r=>{
      if(descScore(item.name, r[descCol]) >= DESC_MATCH_THRESHOLD) byDesc.add(r);
    });
  }
  const hasCodeToken = extractCodeTokens(item.name).length > 0;
  const siblingCount = allItems().filter(other => other.uid !== item.uid && String(other.hs).trim() === String(item.hs).trim()).length;
  const skipHsOnlyMatch = hasCodeToken && siblingCount > 0;

  const byHs = new Set();
  if(hsCol && !skipHsOnlyMatch){
    const precision = fileKey === "wits" ? 6 : 8;
    rowsToSearch.forEach(r=>{
      if(hsMatch(r[hsCol], item.hs, precision)) byHs.add(r);
    });
  }
  return [...new Set([...byDesc, ...byHs])];
}

function rowsForItem(fileKey, item, hsRoleName){
  const f = state.files[fileKey];
  if(!f || !f.mapping) return [];
  const hsCol = f.mapping[hsRoleName];

  const combined = matchItemInRows(f.rows, item, f.mapping, hsCol, fileKey);
  let result = combined.filter(r => passesPeriod(r, f.mapping) && passesSchemeFilter(r, f.mapping));
  if(state.showUsd && state.fxRates){
    result = rowsInUsd(result, f.mapping, state.fxRates).rows;
  }
  return result;
}

// Company-scoped version for Company View: filters to one company's rows ONCE (cheap — a single
// pass over the whole dataset), then matches every catalog item against that much smaller
// pre-filtered set instead of re-scanning the full dataset per item. Confirmed ~30x+ faster on
// real data (20+s → well under 1s for the full catalog) with identical results, since filtering
// by company first and matching item criteria second is mathematically the same as the reverse.
function rowsForItemAmongCompanyRows(fileKey, item, hsRoleName, companyRows){
  const f = state.files[fileKey];
  if(!f || !f.mapping) return [];
  const hsCol = f.mapping[hsRoleName];
  const combined = matchItemInRows(companyRows, item, f.mapping, hsCol, fileKey);
  let result = combined.filter(r => passesPeriod(r, f.mapping) && passesSchemeFilter(r, f.mapping));
  if(state.showUsd && state.fxRates){
    result = rowsInUsd(result, f.mapping, state.fxRates).rows;
  }
  return result;
}

// Confidence breakdown of an already-matched set: how many rows were confirmed by the exact,
// deterministic HS Code match versus only by the fuzzier description text match. A row matched
// only by description (no HS Code confirmation) is worth a manual glance before it goes into a
// director-facing report — this doesn't change what gets matched, only how it's reported.
// Currency breakdown of matched volume — a real balance-sheet exposure question separate
// from landed cost. Mixed-currency rows get excluded from price averages elsewhere (to keep
// those numbers honest), but that means the exposure itself was never actually reported.
// ---------- FX conversion to USD ----------
// The customs data uses inconsistent currency labels (not ISO codes) — map them to what
// Frankfurter (free, no API key, ECB reference rates) actually understands.
const CURRENCY_LABEL_TO_ISO = {
  "US $":"USD", "USD":"USD", "$":"USD",
  "Rmb":"CNY", "RMB":"CNY", "CNY":"CNY",
  "Dhm":"AED", "AED":"AED",
  "YEN":"JPY", "JPY":"JPY", "Yen":"JPY",
  "EURO":"EUR", "EUR":"EUR",
  "Rs.":"PKR", "Rs":"PKR", "PKR":"PKR", // Pakistan customs context — "Rs." means PKR here, not INR
  "Aus. $":"AUD", "AUD":"AUD",
  "STG":"GBP", "GBP":"GBP",
  "Baht":"THB", "THB":"THB",
  "S.Fr":"CHF", "CHF":"CHF",
  "S$":"SGD", "SGD":"SGD",
  "Canadian $":"CAD", "CAD":"CAD",
};

// Date-matched historical FX cache: { byDate: {"YYYY-MM-DD": {ISO: rate vs USD}}, sortedDates: [...],
// coversFrom, coversTo }. Fetches the ACTUAL rate for each shipment's own date, not one blanket
// "today" rate — a shipment from January should convert at January's rate, not August's, since
// these currencies move enough that a single snapshot would distort older comparisons.
let fxRatesCache = null;
const FX_CACHE_KEY_PREFIX = "rm-analyzer:fx-rates:";

function loadCachedFxRates(cacheKey){
  if(fxRatesCache && fxRatesCache._cacheKey === cacheKey) return fxRatesCache;
  try{
    const raw = localStorage.getItem(FX_CACHE_KEY_PREFIX + cacheKey);
    if(raw){
      const parsed = JSON.parse(raw);
      parsed._cacheKey = cacheKey;
      fxRatesCache = parsed;
      return fxRatesCache;
    }
  }catch(e){}
  return null;
}

// Fetches historical daily rates for the whole date span in the matched data, in ONE network
// call, then caches permanently (historical rates are immutable — Frankfurter's own guidance is
// to cache them forever, so there's no freshness window to worry about like a "latest rate" would need).
async function fetchFxRatesForRange(minDateStr, maxDateStr){
  const cacheKey = `${minDateStr}_${maxDateStr}`;
  const cached = loadCachedFxRates(cacheKey);
  if(cached) return cached;

  const isoCodes = [...new Set(Object.values(CURRENCY_LABEL_TO_ISO))].filter(c=>c!=="USD");
  // Two independent hosts/formats — a "Failed to fetch" against one (network/CORS/DNS) doesn't
  // mean the other fails the same way, since they're different infrastructure.
  const attempts = [
    { url: `https://api.frankfurter.dev/v2/rates?base=USD&quotes=${isoCodes.join(",")}&from=${minDateStr}&to=${maxDateStr}`, shape: "v2" },
    { url: `https://api.frankfurter.app/${minDateStr}..${maxDateStr}?from=USD&to=${isoCodes.join(",")}`, shape: "v1" },
  ];

  let lastError = null;
  for(const attempt of attempts){
    try{
      const resp = await fetch(attempt.url);
      if(!resp.ok){ lastError = new Error(`HTTP ${resp.status} (${attempt.shape})`); continue; }
      const data = await resp.json();
      let byDate = null;
      if(attempt.shape === "v1" && data && data.rates && typeof data.rates === "object"){
        byDate = data.rates; // { "YYYY-MM-DD": { EUR: 0.86, ... }, ... }
      } else if(attempt.shape === "v2" && Array.isArray(data)){
        byDate = {};
        data.forEach(row=>{
          if(!row.date) return;
          if(!byDate[row.date]) byDate[row.date] = {};
          byDate[row.date][row.quote] = row.rate;
        });
      }
      if(!byDate || Object.keys(byDate).length === 0){
        lastError = new Error(`Unexpected response shape (${attempt.shape})`);
        continue;
      }
      const sortedDates = Object.keys(byDate).sort();
      fxRatesCache = { byDate, sortedDates, coversFrom: minDateStr, coversTo: maxDateStr, fetchedAt: Date.now(), _cacheKey: cacheKey };
      try{ localStorage.setItem(FX_CACHE_KEY_PREFIX + cacheKey, JSON.stringify(fxRatesCache)); }catch(e){}
      return fxRatesCache;
    }catch(e){
      lastError = e;
    }
  }
  throw lastError || new Error("Both exchange rate endpoints failed");
}

// ECB publishes on business days only — weekends/holidays have no entry. Standard practice
// (and Frankfurter's own guidance) is to forward-fill from the nearest earlier published date.
function nearestFxDate(fxRates, dateStr){
  if(fxRates.byDate[dateStr]) return dateStr;
  // binary-search-free linear walk is fine here — sortedDates is at most a few hundred entries
  for(let i=fxRates.sortedDates.length-1; i>=0; i--){
    if(fxRates.sortedDates[i] <= dateStr) return fxRates.sortedDates[i];
  }
  return fxRates.sortedDates[0] || null; // shipment dated before the fetched range — use earliest available as a fallback
}

// Converts a value FROM a given currency label TO USD, using the rate for that SPECIFIC date
// (not a blanket current rate). Returns null (never a silently wrong number) if the currency or
// date can't be resolved.
function convertToUsdOnDate(value, currencyLabel, dateStr, fxRates){
  if(value===null || value===undefined || isNaN(value)) return null;
  const iso = CURRENCY_LABEL_TO_ISO[String(currencyLabel||"").trim()];
  if(!iso) return null;
  if(iso === "USD") return value;
  if(!fxRates || !dateStr) return null;
  const useDate = nearestFxDate(fxRates, dateStr);
  if(!useDate) return null;
  const dayRates = fxRates.byDate[useDate];
  if(!dayRates || !dayRates[iso]) return null;
  return value / dayRates[iso];
}

// Returns a NEW array of shallow-copied rows with the price field overwritten to its USD
// equivalent (converted at THAT ROW'S OWN shipment date's rate) and currency set to "USD" — so
// every existing, already-tested aggregation function downstream (top tables, landed cost, month
// matrix, etc.) works unmodified, seeing USD-denominated data as if that were the source. Rows
// whose currency or date can't be resolved are left OUT (not silently included at the wrong
// value) and counted so the UI can report them.
function rowsInUsd(rows, mapping, fxRates){
  if(!mapping.price || !mapping.currency) return { rows, unconverted: 0 };
  let unconverted = 0;
  const converted = [];
  rows.forEach(r=>{
    const d = rowDate(r, mapping);
    const dateStr = d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` : null;
    const usdPrice = convertToUsdOnDate(num(r[mapping.price]), r[mapping.currency], dateStr, fxRates);
    if(usdPrice === null){ unconverted++; return; }
    const copy = Object.assign({}, r);
    copy[mapping.price] = usdPrice;
    copy[mapping.currency] = "USD";
    converted.push(copy);
  });
  return { rows: converted, unconverted };
}

function currencyExposure(rows, mapping){
  if(!mapping || !mapping.currency || !mapping.qty) return null;
  const byCurrency = {};
  let totalQty = 0;
  rows.forEach(r=>{
    const cur = r[mapping.currency];
    const q = num(r[mapping.qty]);
    if(!cur || isNaN(q)) return;
    const key = String(cur).trim();
    byCurrency[key] = (byCurrency[key]||0) + q;
    totalQty += q;
  });
  if(totalQty === 0) return null;
  return Object.entries(byCurrency)
    .map(([cur,qty])=>({ currency:cur, qty, pct: qty/totalQty*100 }))
    .sort((a,b)=>b.qty-a.qty);
}

function matchConfidenceStats(fileKey, item, hsRoleName){
  const f = state.files[fileKey];
  if(!f || !f.mapping) return null;
  const hsCol = f.mapping[hsRoleName];
  const descCol = f.mapping.desc;
  const precision = fileKey === "wits" ? 6 : 8;
  const matched = rowsForItem(fileKey, item, hsRoleName);
  if(matched.length === 0) return null;

  let hsOnly = 0, descOnly = 0, both = 0;
  matched.forEach(r=>{
    const descOk = descCol && descScore(item.name, r[descCol]) >= DESC_MATCH_THRESHOLD;
    const hsOk = hsCol && hsMatch(r[hsCol], item.hs, precision);
    if(descOk && hsOk) both++;
    else if(hsOk) hsOnly++;
    else if(descOk) descOnly++;
  });
  const total = matched.length;
  return { total, hsOnly, descOnly, both, hsConfirmedPct: (hsOnly+both)/total*100 };
}

// Aggregate matched rows by a grouping column (company name, or region/country).
// Returns [[key, {qty, priceAvg, currency, n}], ...] sorted by qty desc.
function aggregateBy(rows, keyCol, mapping, normalizeKey){
  if(!keyCol) return [];
  const agg = {};
  const roles = Object.keys(mapping||{});
  rows.forEach(r=>{
    const rawKey = r[keyCol] || "(unspecified)";
    const key = normalizeKey ? normalizeKey(rawKey) : rawKey;
    if(!agg[key]) agg[key] = { qty:0, priceSum:0, n:0, weightedSum:0, weightedQty:0, currency:null, values:{}, nameCounts:{} };
    agg[key].nameCounts[rawKey] = (agg[key].nameCounts[rawKey]||0) + 1;
    const q = num(r[mapping.qty]); if(!isNaN(q)) agg[key].qty += q;
    const p = num(r[mapping.price]);
    if(!isNaN(p)){
      agg[key].priceSum += p; agg[key].n++;
      if(!isNaN(q)){ agg[key].weightedSum += p*q; agg[key].weightedQty += q; }
    }
    if(!agg[key].currency && mapping.currency && r[mapping.currency]) agg[key].currency = r[mapping.currency];
    roles.forEach(role=>{
      const col = mapping[role];
      if(!col) return;
      const val = r[col];
      if(val===undefined || val===null || val==="") return;
      agg[key].values[role] = agg[key].values[role] || new Set();
      agg[key].values[role].add(val);
    });
  });
  return Object.entries(agg)
    .map(([key,v]) => {
      // Display the most-frequent real name seen for this group, not the stripped normalization
      // key — merging duplicates should be invisible except that they no longer double-count.
      let displayName = key, bestCount = 0;
      Object.entries(v.nameCounts).forEach(([raw,c])=>{ if(c>bestCount || (c===bestCount && raw.length>displayName.length)){ displayName=raw; bestCount=c; } });
      const variantCount = Object.keys(v.nameCounts).length;
      return [displayName, {
        qty:v.qty,
        // quantity-weighted average when qty data is available for the priced shipments; falls back
        // to a simple mean only if qty is missing entirely (one shipment shouldn't outweigh fifty).
        priceAvg: v.weightedQty>0 ? v.weightedSum/v.weightedQty : (v.n ? v.priceSum/v.n : null),
        currency:v.currency, values:v.values,
        mergedVariantCount: variantCount>1 ? variantCount : 0
      }];
    })
    .sort((a,b) => b[1].qty - a[1].qty);
}

const KG_PER_MT = 1000;

// Quantity display in MT (director-requested unit), converted from the underlying KG data.
function fmtQtyMt(qtyKg){
  if(qtyKg===null || qtyKg===undefined || isNaN(qtyKg)) return "—";
  return (qtyKg/KG_PER_MT).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

// The manual "our position" entry is in MT (matches the input label and the rest of the
// tool's MT-first display), but the underlying customs data — and aggregateBy's qty totals —
// are always in KG at source. Converts once, consistently, everywhere our qty needs to be
// compared against real import data for ranking. Bug this fixes: without this conversion, a
// director-entered "51,182.72" (meant as MT) was being compared as if it were 51,182.72 KG
// (≈51 MT) — ranking far too low against real importers whose totals are in the thousands of MT.
function manualQtyKg(manual){
  const v = num(manual.qty);
  return isNaN(v) ? NaN : v * KG_PER_MT;
}

// Unit price displayed per KG — deliberately NOT converted to match the MT quantity display.
// Per-KG pricing is the standard convention in chemical/commodity trading even when volumes
// are discussed in tons, so qty (MT) and price (per KG) intentionally use different bases.
function fmtPricePerKg(priceKg, currency){
  if(priceKg===null || priceKg===undefined || isNaN(priceKg)) return "—";
  return priceKg.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) + (currency ? ` ${currency}` : "");
}

function num(v){
  if(v===undefined||v===null||v==="") return NaN;
  if(typeof v === "number") return isNaN(v) ? NaN : v;
  const cleaned = String(v).trim().replace(/[^0-9.\-]/g, "");
  if(cleaned==="" || cleaned==="-" || cleaned==="." ) return NaN;
  const n = parseFloat(cleaned);
  return isNaN(n) ? NaN : n;
}

// Only average/rank prices that share the same currency — mixing e.g. YEN and USD
// unit prices produces a meaningless blended number.
function dominantCurrencyPrices(rows, mapping){
  if(!mapping || !mapping.price) return { prices:[], pairs:[], currency:null, excluded:0 };
  if(!mapping.currency){
    const pairs = rows.map(r=>({price:num(r[mapping.price]), qty:num(r[mapping.qty])})).filter(x=>!isNaN(x.price));
    return { prices: pairs.map(x=>x.price), pairs, currency:null, excluded:0 };
  }
  const counts = {};
  rows.forEach(r=>{ const c = r[mapping.currency]; if(c) counts[c] = (counts[c]||0)+1; });
  let dominant = null, best = 0;
  Object.entries(counts).forEach(([c,n])=>{ if(n>best){ dominant=c; best=n; } });
  let excluded = 0;
  const pairs = [];
  rows.forEach(r=>{
    const p = num(r[mapping.price]);
    if(isNaN(p)) return;
    const c = r[mapping.currency];
    if(dominant && c && c!==dominant){ excluded++; return; }
    pairs.push({ price:p, qty:num(r[mapping.qty]) });
  });
  return { prices: pairs.map(x=>x.price), pairs, currency:dominant, excluded };
}

// Quantity-weighted average — falls back to a simple mean if qty data isn't usable for enough pairs.
function weightedAverage(pairs){
  const withQty = pairs.filter(x=>!isNaN(x.qty) && x.qty>0);
  if(withQty.length>0){
    const totalQty = withQty.reduce((a,x)=>a+x.qty,0);
    const weightedSum = withQty.reduce((a,x)=>a+x.price*x.qty,0);
    return totalQty>0 ? weightedSum/totalQty : null;
  }
  if(pairs.length===0) return null;
  return pairs.reduce((a,x)=>a+x.price,0)/pairs.length;
}

      if(statusEl){
        statusEl.textContent = `Converted using each shipment's own date's rate (${state.fxRates.coversFrom} to ${state.fxRates.coversTo}, ECB reference rates via Frankfurter).`;

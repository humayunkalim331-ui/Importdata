    const fromEl = d.querySelector("#period-from"), toEl = d.querySelector("#period-to");
    if(fromEl) fromEl.addEventListener("change", e=>{ state.periodFrom = e.target.value; render(); });
    if(toEl) toEl.addEventListener("change", e=>{ state.periodTo = e.target.value; render(); });
  });

  return d;
}

function competitorGridTable(rows, mapping, companyRole){
  const hasKey = mapping && (mapping.hs || mapping.desc);
  if(!hasKey || rows.length===0){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = !hasKey
      ? "Upload this file and map the HS Code and/or Item Description column to see matches."
      : "No matching records found for this item.";
    return p;
  }
  const nameCol = mapping[companyRole];
  const priceCol = mapping.price;
  if(!nameCol || !priceCol){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = "Map the supplier/company and unit price columns to display this table.";
    return p;
  }

  // Import side gets the full "which supplier, how much, what origin" breakdown per the
  // director's brief. Export side (no natural supplier-per-transaction concept in that
  // file) falls back to the previous shipment-list view, unchanged.
  const isImportSide = companyRole === "importer" && mapping.supplier;

  const top = aggregateBy(rows, nameCol, mapping, companyKey).slice(0,5);

  const wrap = document.createElement("div");
  const note = document.createElement("div");
  note.className = "empty-note";
  note.style.marginBottom = "8px";
  note.textContent = isImportSide
    ? "Top 5 importers by quantity. Click any card to see the full supplier breakdown — every supplier they bought from, not just a truncated list."
    : "Top 5 competitors by quantity. Each column is one company — every date/price listed is an actual shipment, not an average.";
  wrap.appendChild(note);

  if(isImportSide){
    const cardsWrap = document.createElement("div");
    cardsWrap.style.display = "grid";
    cardsWrap.style.gridTemplateColumns = "repeat(auto-fit, minmax(220px, 1fr))";
    cardsWrap.style.gap = "10px";
    cardsWrap.style.alignItems = "start";

    let currentlyExpanded = null; // only one card expanded at a time — keeps the view uncluttered

    top.forEach(([name, v])=>{
      const breakdown = counterpartyBreakdown(rows, mapping, "importer", name, "supplier", "origin");
      const card = document.createElement("div");
      card.style.cssText = "background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;";
      const supplierCount = breakdown.length;
      const shipmentCount = breakdown.reduce((a,b)=>a+b.shipments,0);
      const label = document.createElement("div");
      label.style.cssText = "color:var(--accent);font-size:10.5px;margin-top:6px;";
      label.textContent = "▸ View supplier breakdown";
      card.innerHTML = `
        <div style="font-weight:600;font-size:12.5px;margin-bottom:4px;">${escHtml(name)}${v.mergedVariantCount ? ` <span title="This company appears under ${v.mergedVariantCount+1} different spellings in the source file — combined here as one." style="cursor:help;color:var(--text-dim);font-size:11px;">ⓘ</span>` : ""}</div>
        <div style="color:var(--accent);font-weight:700;font-size:15px;">${fmtQtyMt(v.qty)} MT</div>
        <div style="color:var(--text-dim);font-size:11px;margin-top:2px;">${fmtPricePerKg(v.priceAvg, v.currency)} avg · ${supplierCount} supplier${supplierCount===1?"":"s"} · ${shipmentCount} shipment${shipmentCount===1?"":"s"}</div>
      `;
      card.appendChild(label);
      const detailOuter = document.createElement("div");
      detailOuter.style.display = "none";
      detailOuter.style.marginTop = "8px";
      detailOuter.style.overflowX = "auto"; // safety net if a table is still wider than the expanded card
      detailOuter.innerHTML = breakdownTableHtml(breakdown, "Supplier", true);
      card.appendChild(detailOuter);

      const collapse = ()=>{
        detailOuter.style.display = "none";
        label.textContent = "▸ View supplier breakdown";
        card.style.gridColumn = "";
      };
      const expand = ()=>{
        if(currentlyExpanded && currentlyExpanded !== collapse) currentlyExpanded();
        detailOuter.style.display = "block";
        label.textContent = "▾ Hide supplier breakdown";
        card.style.gridColumn = "1 / -1"; // span full row width so the table has room, instead of overflowing into neighboring cards
        currentlyExpanded = collapse;
      };

      card.addEventListener("click", ()=>{
        const isOpen = detailOuter.style.display !== "none";
        if(isOpen){ collapse(); currentlyExpanded = null; }
        else{ expand(); }
      });
      cardsWrap.appendChild(card);
    });
    wrap.appendChild(cardsWrap);
    return wrap;
  }

  // Export-side fallback: unchanged shipment-list layout.
  const topNames = top.map(([n])=>n);
  const byCompany = {};
  topNames.forEach(n => byCompany[n] = []);
  rows.forEach(r=>{
    const name = matchCompanyName(r[nameCol], topNames);
    if(name) byCompany[name].push(r);
  });
  Object.keys(byCompany).forEach(name=>{
    byCompany[name].sort((a,b)=>{
      const da = rowDate(a, mapping), db = rowDate(b, mapping);
      if(da && db) return db - da;
      if(da && !db) return -1;
      if(!da && db) return 1;
      return 0;
    });
  });

  const MAX_SHOWN = 6;
  const hbar = document.createElement("div");
  hbar.className = "hbar";
  const table = document.createElement("table");
  table.innerHTML = `
    <tr>${topNames.map(n=>`<th>${escHtml(n)}</th>`).join("")}</tr>
    <tr>
      ${topNames.map(n=>{
        const entries = byCompany[n];
        const shown = entries.slice(0, MAX_SHOWN);
        const rest = entries.length - shown.length;
        const lines = shown.map(r=>{
          const d = rowDate(r, mapping);
          const price = r[priceCol] ?? "—";
          const cur = mapping.currency ? (r[mapping.currency] || "") : "";
          const q = num(r[mapping.qty]);
          return `<div style="padding:3px 0;border-bottom:1px solid var(--border);white-space:nowrap;">
            <span style="color:var(--text-dim);">${d ? d.toLocaleDateString() : "—"}</span>
            — <span style="color:var(--accent);font-weight:600;">${escHtml(price)}</span> ${escHtml(cur)}
            ${!isNaN(q) ? `<span style="color:var(--text-dim);"> · ${q.toLocaleString()}</span>` : ""}
          </div>`;
        }).join("");
        return `<td style="text-align:left;vertical-align:top;min-width:180px;">
          <div style="max-height:220px;overflow-y:auto;">
            ${lines || `<span class="empty-note">—</span>`}
          </div>
          ${rest>0 ? `<div style="color:var(--text-dim);font-size:10.5px;margin-top:4px;">+${rest} more shipment${rest===1?"":"s"}</div>` : ""}
        </td>`;
      }).join("")}
    </tr>
  `;
  hbar.appendChild(table);
  wrap.appendChild(hbar);
  return wrap;
}

const CURRENCY_CODES = new Set(["USD","PKR","EUR","GBP","CNY","JPY","AED","SAR","THB","INR","CHF","AUD","CAD","SGD","HKD","KRW","MYR","IDR","TRY","ZAR","QAR","KWD"]);

function regionTable(rows, mapping, regionRole, nameRoles){
  // nameRoles: array of [roleKey, label] pairs, e.g. [["importer","Importers"],["supplier","Suppliers"]]
  const hasKey = mapping && (mapping.hs || mapping.desc);
  const regionCol = mapping && mapping[regionRole];
  if(!hasKey || rows.length===0 || !regionCol || !mapping.price){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = !regionCol
      ? "Map the country/region column for this file to see the regional breakdown."
      : "No matching records found for this item.";
    return p;
  }
  const nameCols = nameRoles.map(([role,label])=>[role, label, mapping[role]]).filter(([,,col])=>col);
  const byRegion = {};
  rows.forEach(r=>{
    const region = r[regionCol] || "(unspecified)";
    if(!byRegion[region]){
      byRegion[region] = { qty:0, priceSum:0, n:0, weightedSum:0, weightedQty:0, currency:null, names:{} };
      nameCols.forEach(([role])=>{ byRegion[region].names[role] = new Set(); });
    }
    const q = num(r[mapping.qty]); if(!isNaN(q)) byRegion[region].qty += q;
    const p = num(r[mapping.price]);
    if(!isNaN(p)){
      byRegion[region].priceSum += p; byRegion[region].n++;
      if(!isNaN(q)){ byRegion[region].weightedSum += p*q; byRegion[region].weightedQty += q; }
    }
    if(!byRegion[region].currency && mapping.currency && r[mapping.currency]) byRegion[region].currency = r[mapping.currency];
    nameCols.forEach(([role,,col])=>{ if(r[col]) byRegion[region].names[role].add(companyKey(r[col])); });
  });
  const entries = Object.entries(byRegion).sort((a,b)=>b[1].qty-a[1].qty).slice(0,6);

  const regionKeys = Object.keys(byRegion);
  const currencyLikeCount = regionKeys.filter(k=>CURRENCY_CODES.has(String(k).toUpperCase().trim())).length;
  const looksLikeCurrency = regionKeys.length>0 && (currencyLikeCount/regionKeys.length) > 0.5;

  const wrap = document.createElement("div");
  if(looksLikeCurrency){
    const warn = document.createElement("div");
    warn.className = "warn";
    warn.style.marginBottom = "8px";
    warn.textContent = `The mapped column looks like currency codes (${regionKeys.slice(0,3).join(", ")}…), not country names — recheck this file's "${regionRole==="origin"?"Country of Origin":"Exporting Country"}" mapping above.`;
    wrap.appendChild(warn);
  }
  wrap.classList.add("hbar");
  const table = document.createElement("table");
  table.innerHTML = `
    <tr>${entries.map(([region])=>`<th>${escHtml(region)}</th>`).join("")}</tr>
    <tr>${entries.map(([,v])=>`<td class="price">${v.weightedQty>0 ? (v.weightedSum/v.weightedQty).toFixed(2) : (v.n?(v.priceSum/v.n).toFixed(2):"—")}${v.currency?` <span style="color:var(--text-dim);font-size:10px;">${escHtml(v.currency)}</span>`:""}</td>`).join("")}</tr>
    ${nameCols.map(([role,label])=>`
      <tr>${entries.map(([,v])=>`<td style="text-align:left;vertical-align:top;font-size:10.5px;"><span style="color:var(--text-dim);text-transform:uppercase;font-size:9.5px;">${escHtml(label)}</span><br>${[...v.names[role]].slice(0,3).map(escHtml).join(", ") || "—"}</td>`).join("")}</tr>
    `).join("")}
  `;
  wrap.appendChild(table);
  return wrap;
}

function topTable(rows, mapping, cols){
  const hasKey = mapping && (mapping.hs || mapping.desc);
  if(!hasKey || rows.length===0 || !mapping.qty){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = "Not enough mapped data yet.";
    return p;
  }
  const nameCol = mapping[cols[0][0]];
  if(!nameCol){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = `Map the "${cols[0][1]}" column to build this table.`;
    return p;
  }
  const top = aggregateBy(rows, nameCol, mapping, companyKey).slice(0,5);
  // Import side has a natural counterparty (supplier) to break down by; export side doesn't
  // (no equivalent field in that file), so keeps the original truncated-list behavior there.
  const supportsBreakdown = cols[0][0]==="importer" && cols.some(([role])=>role==="supplier") && mapping.price;
  // Computed once per row so the toggle button's count and the expanded table always agree —
  // using two different counting methods here previously showed a raw, unmerged supplier
  // count on the button but the correctly name-merged count inside, which could disagree.
  const breakdowns = supportsBreakdown ? top.map(([name])=>counterpartyBreakdown(rows, mapping, "importer", name, "supplier", "origin")) : [];

  const wrap = document.createElement("div");

  const chartWrap = document.createElement("div");
  chartWrap.style.marginBottom = "12px";
  const chartLabel = document.createElement("div");
  chartLabel.style.cssText = "font-size:11px;color:var(--text-dim);margin-bottom:4px;";
  chartLabel.textContent = `Quantity by ${cols[0][1].toLowerCase()} — largest highlighted:`;
  chartWrap.appendChild(chartLabel);
  const chartItems = top.map(([name,v],i)=>({ label:name, value:v.qty, highlight:i===0 }));
  chartWrap.innerHTML += barChartSvg(chartItems, { valueFormatter: v => fmtQtyMt(v) + " MT" });
  wrap.appendChild(chartWrap);

  const table = document.createElement("table");
  table.className = "data-table";
  table.innerHTML = `
    <tr>${cols.map(([role,label])=>role==="supplier" && supportsBreakdown ? `<th>${label} breakdown</th>` : `<th>${label}</th>`).join("")}</tr>
    ${top.map(([name,v],i)=>`<tr>${cols.map(([role])=>{
      if(role===cols[0][0]) return `<td>${escHtml(name)}</td>`;
      if(role==="qty") return `<td class="num">${fmtQtyMt(v.qty)}</td>`;
      if(role==="price") return `<td class="num">${fmtPricePerKg(v.priceAvg, v.currency)}</td>`;
      if(role==="supplier" && supportsBreakdown){
        const n = breakdowns[i].length;
        return `<td><button class="btn small breakdown-toggle" data-idx="${i}" style="white-space:nowrap;">▸ ${n} supplier${n===1?"":"s"}</button></td>`;
      }
      const vals = v.values[role] ? [...v.values[role]] : [];
      if(vals.length===0) return `<td>—</td>`;
      const shown = vals.slice(0,3).map(escHtml).join(", ");
      const rest = vals.length - 3;
      return `<td>${shown}${rest>0?` <span style="color:var(--text-dim);font-size:10.5px;">+${rest} more</span>`:""}</td>`;
    }).join("")}</tr>
    ${supportsBreakdown ? `<tr class="breakdown-row" data-idx="${i}" style="display:none;"><td colspan="${cols.length}" style="background:var(--surface);">${breakdownTableHtml(breakdowns[i], "Supplier", true)}</td></tr>` : ""}`).join("")}
  `;
  wrap.appendChild(table);

  if(supportsBreakdown){
    table.querySelectorAll(".breakdown-toggle").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const idx = btn.getAttribute("data-idx");
        const row = table.querySelector(`.breakdown-row[data-idx="${idx}"]`);
        if(!row) return;
        const isOpen = row.style.display !== "none";
        row.style.display = isOpen ? "none" : "table-row";
        btn.textContent = btn.textContent.replace(isOpen ? "▾" : "▸", isOpen ? "▸" : "▾");
      });
    });
  }
  return wrap;
}

// Company View — one glance-level table showing where a single named company stands across
// EVERY catalog item, not just the currently-selected one. Reuses the exact same tested
// ranking logic (ourQtyAndPrice, excludeOurCompany) already proven correct per-item, just run
// once per item instead of once per screen. Items with no real data for this company AND no
// manual entry are skipped — nothing to rank there, and listing "n/a" rows for the whole
// 30+ item catalog would bury the items that actually matter.
// Month-by-month breakdown of ONE company's OWN rows for one item — qty, weighted unit price,
// weighted duty-paid cost, suppliers, and origins per month. One comprehensive table that
// answers both "what was our qty trajectory" and "why did the price/duty-paid trend move" from
// the same underlying data, rather than building a separate narrow view per column.
function companyItemMonthBreakdown(companyRows, mapping, headers){
  const lcCols = detectLandedCostColumns(headers);
  const byMonth = {};
  companyRows.forEach(r=>{
    const d = rowDate(r, mapping);
    if(!d) return;
    const mk = monthKey(d);
    const q = num(r[mapping.qty]);
    if(isNaN(q) || q<=0) return;
    if(!byMonth[mk]) byMonth[mk] = { qty:0, weightedPriceSum:0, weightedDpcSum:0, dpcQty:0, suppliers:new Set(), origins:new Set() };
    byMonth[mk].qty += q;
    const p = num(r[mapping.price]);
    if(!isNaN(p)) byMonth[mk].weightedPriceSum += p*q;
    const dpc = landedCostPerUnit(r, lcCols, q, mapping);
    if(dpc!==null && !isNaN(dpc)){ byMonth[mk].weightedDpcSum += dpc*q; byMonth[mk].dpcQty += q; }
    if(mapping.supplier && r[mapping.supplier]) byMonth[mk].suppliers.add(String(r[mapping.supplier]).trim());
    if(mapping.origin && r[mapping.origin]) byMonth[mk].origins.add(String(r[mapping.origin]).trim());
  });
  return Object.keys(byMonth).sort().map(mk=>{
    const v = byMonth[mk];
    return {
      month: mk,
      qty: v.qty,
      avgPrice: v.qty>0 ? v.weightedPriceSum/v.qty : null,
      avgDpc: v.dpcQty>0 ? v.weightedDpcSum/v.dpcQty : null,
      suppliers: [...v.suppliers],
      origins: [...v.origins],
    };
  });
}

// Pure data function — no DOM. Computes one company's position across every catalog item.
// Shared by the on-screen Company View table and the PPT's Company Portfolio slide, so both
// are guaranteed to show identical numbers rather than risking two separate implementations
// drifting apart.
function computeCompanyViewResults(companyName){
  const mapping = state.files.import?.mapping;
  if(!companyName || !companyName.trim() || !mapping || !mapping.importer || !mapping.qty) return [];

  const f = state.files.import;
  const ourKey = companyKey(companyName);
  const companyRowsAll = f.rows.filter(r => companyKey(r[mapping.importer]) === ourKey);

  const results = [];
  allItems().forEach(item=>{
    const impRowsForCompany = rowsForItemAmongCompanyRows("import", item, "hs", companyRowsAll);
    const manual = state.manual[item.uid] || {};
    const hasManual = manual.qty && !isNaN(manualQtyKg(manual));
    if(impRowsForCompany.length===0 && !hasManual) return;

    const impRows = rowsForItem("import", item, "hs");
    if(impRows.length===0) return;
    const ourData = ourQtyAndPrice(impRows, mapping, manual, companyName);
    if(!ourData) return;

    const rowsExcl = excludeOurCompany(impRows, mapping, "importer", companyName);
    const byImporter = aggregateBy(rowsExcl, mapping.importer, mapping, companyKey);
    let qtyRank = null, qtyOf = null, top1Qty = null;
    if(byImporter.length>0){
      const allQ = [...byImporter.map(([,v])=>v.qty), ourData.qty].sort((a,b)=>b-a);
      qtyRank = allQ.indexOf(ourData.qty)+1;
      qtyOf = allQ.length;
      top1Qty = [...byImporter].sort((a,b)=>b[1].qty-a[1].qty)[0];
    }
    let priceRank = null, priceOf = null, cheapest = null;
    if(ourData.priceAvg!==null && !isNaN(ourData.priceAvg) && mapping.price){
      const { prices } = dominantCurrencyPrices(rowsExcl, mapping);
      if(prices.length>0){
        const allP = [...prices, ourData.priceAvg].sort((a,b)=>a-b);
        priceRank = allP.indexOf(ourData.priceAvg)+1;
        priceOf = allP.length;
        cheapest = allP[0];
      }
    }
    const priceMom = monthOverMonthMovement(impRowsForCompany, mapping);
    const dpcMom = landedCostMonthOverMonth(impRowsForCompany, mapping, state.files.import.headers);
    results.push({ item, ourData, qtyRank, qtyOf, top1Qty, priceRank, priceOf, cheapest, priceMom, dpcMom, impRowsForCompany });
  });
  return results;
}

function directorSummaryEl(item, manual, impRows, forceCompanyScoped){
  const mapping = state.files.import?.mapping;
  const wrap = document.createElement("div");
  if(!mapping || impRows.length===0){
    wrap.className = "empty-note";
    wrap.textContent = "Upload and map the import data, and select an item, to see the summary.";
    return wrap;
  }
  const headers = state.files.import.headers;

  // ---- Stat cards ----
  const cards = [];

  // Our rank by QUANTITY — director's priority metric — and who's #1, for direct comparison.
  // Prefers our own real matched data over the manual entry when available (see ourQtyAndPrice).
  // This stays company-aware everywhere (main page AND Company View) — "where do we stand" is
  // useful regardless of context, unlike the market-trend cards below.
  const ourData = ourQtyAndPrice(impRows, mapping, manual);

  // Company's own rows only — used below so Price Trend, Duty-Paid Cost Trend, and Savings
  // Potential reflect THIS company's actual purchase history, not the whole market blended
  // together. ONLY active when explicitly requested (forceCompanyScoped=true, i.e. Company
  // View's drill-down) — the main item page always shows whole-market analysis, since a
  // director browsing an item generally wants overall market context there, not our own
  // narrow trend. Without the explicit flag, this used to trigger whenever "Our company name"
  // happened to be set globally, incorrectly making the MAIN page company-scoped too.
  const ourRowsOnly = (forceCompanyScoped && state.ourCompanyName && state.ourCompanyName.trim() && mapping.importer)
    ? impRows.filter(r => companyKey(r[mapping.importer]) === companyKey(state.ourCompanyName))
    : [];
  const useCompanyScoped = ourRowsOnly.length > 0;

  if(ourData && mapping.importer && mapping.qty){
    const ourQty = ourData.qty;
    const byImporter = aggregateBy(excludeOurCompany(impRows, mapping, "importer"), mapping.importer, mapping, companyKey);
    if(!isNaN(ourQty) && byImporter.length>0){
      const allQtys = [...byImporter.map(([,v])=>v.qty), ourQty].sort((a,b)=>b-a);
      const qtyRank = allQtys.indexOf(ourQty) + 1;
      const sortedByQty = [...byImporter].sort((a,b)=>b[1].qty-a[1].qty);
      let top1Note;
      if(qtyRank === 1){
        const runnerUp = sortedByQty[0];
        top1Note = runnerUp ? `We're largest — next: ${runnerUp[0].length>20?runnerUp[0].slice(0,18)+"…":runnerUp[0]} @ ${fmtQtyMt(runnerUp[1].qty)} MT` : "We're the largest by volume";
      } else {
        const top1ByQty = sortedByQty[0];
        top1Note = top1ByQty ? `#1: ${top1ByQty[0].length>20?top1ByQty[0].slice(0,18)+"…":top1ByQty[0]} @ ${fmtQtyMt(top1ByQty[1].qty)} MT` : "by quantity";
      }
      cards.push({ label:"Our Rank (by Qty)", value:`#${qtyRank} of ${allQtys.length}`, note: (ourData.source==="real"?"✓ using real data — ":"") + top1Note });
    }
  }

  // Secondary: rank by unit price — same real-data-first preference.
  if(ourData && mapping.price && ourData.priceAvg!==null && !isNaN(ourData.priceAvg)){
    const { prices, currency } = dominantCurrencyPrices(excludeOurCompany(impRows, mapping, "importer"), mapping);
    if(prices.length>0){
      const all = [...prices, ourData.priceAvg].sort((a,b)=>a-b);
      const rank = all.indexOf(ourData.priceAvg) + 1;
      const byImporterPrice = mapping.importer ? aggregateBy(excludeOurCompany(impRows, mapping, "importer"), mapping.importer, mapping, companyKey) : [];
      const sortedByPrice = byImporterPrice.length>0 ? [...byImporterPrice].sort((a,b)=>(a[1].priceAvg??Infinity)-(b[1].priceAvg??Infinity)) : [];
      let top1Note;
      if(rank === 1){
        const runnerUp = sortedByPrice[0];
        top1Note = runnerUp && runnerUp[1].priceAvg!==null ? `We're cheapest — next: ${runnerUp[0].length>20?runnerUp[0].slice(0,18)+"…":runnerUp[0]} @ ${runnerUp[1].priceAvg.toFixed(2)} ${runnerUp[1].currency||""}` : "We're the lowest priced";
      } else {
        const top1ByPrice = sortedByPrice[0];
        top1Note = top1ByPrice && top1ByPrice[1].priceAvg!==null
          ? `#1: ${top1ByPrice[0].length>20?top1ByPrice[0].slice(0,18)+"…":top1ByPrice[0]} @ ${top1ByPrice[1].priceAvg.toFixed(2)} ${top1ByPrice[1].currency||""}`
          : "by unit price";
      }
      cards.push({ label:"Our Rank (by Price)", value:`#${rank} of ${all.length}`, note: top1Note });
    }
  }

  const { ranked, allSuppliersByVolume } = computeLandedCostRanking(impRows, mapping, headers, "supplier", item);
  if(ranked.length>0){
    cards.push({ label:"Cheapest Duty-Paid Cost", value:`${fmtPricePerKg(ranked[0][1])}${state.showUsd?" $/KG":" PKR/KG"}`, note: ranked[0][0].length>24 ? ranked[0][0].slice(0,22)+"…" : ranked[0][0] });
  }
  if(allSuppliersByVolume.length>0){
    const top = allSuppliersByVolume[0];
    cards.push({ label:"Top Supplier by Volume", value:`${top[2].toFixed(0)}%`, note: (top[0].length>24?top[0].slice(0,22)+"…":top[0]) + (top[2]>=40?" ⚠️":"") });
  }

  const mom = monthOverMonthMovement(useCompanyScoped ? ourRowsOnly : impRows, mapping);
  if(mom){
    const up = mom.pctChange >= 0;
    cards.push({ label:`Price Trend (MoM)${useCompanyScoped?' — Ours':''}`, value:`${up?'▲':'▼'} ${Math.abs(mom.pctChange).toFixed(1)}%`, note: `${monthLabel(mom.priorMonth)} → ${monthLabel(mom.latestMonth)}` + (useCompanyScoped?'':' (whole market)'), color: up?"var(--bad)":"var(--good)" });
  }

  // Duty-paid cost trend — genuinely different information from the price trend above, since
  // duty/SRO treatment can shift even when declared price doesn't.
  const lcTrend = landedCostMonthOverMonth(useCompanyScoped ? ourRowsOnly : impRows, mapping, headers);
  if(lcTrend){
    const up = lcTrend.pctChange >= 0;
    cards.push({ label:`Duty-Paid Cost Trend (MoM)${useCompanyScoped?' — Ours':''}`, value:`${up?'▲':'▼'} ${Math.abs(lcTrend.pctChange).toFixed(1)}%`, note: `${monthLabel(lcTrend.priorMonth)} → ${monthLabel(lcTrend.latestMonth)}` + (useCompanyScoped?'':' (whole market)'), color: up?"var(--bad)":"var(--good)" });
  }

  if(ranked.length>=1){
    let blended = null, blendedQty = null;
    if(useCompanyScoped){
      // Our own blended duty-paid cost, from our own shipments only.
      const lcCols = detectLandedCostColumns(headers);
      let wsum = 0, wqty = 0;
      ourRowsOnly.forEach(r=>{
        const q = num(r[mapping.qty]);
        if(isNaN(q) || q<=0) return;
        const dpc = landedCostPerUnit(r, lcCols, q, mapping);
        if(dpc===null || isNaN(dpc)) return;
        wsum += dpc*q; wqty += q;
      });
      if(wqty>0){ blended = wsum/wqty; blendedQty = wqty; }
    } else if(ranked.length>=2){
      const { totalQtyAllSuppliers, actualWeightedSumAll } = computeLandedCostRanking(impRows, mapping, headers, "supplier", item);
      blended = actualWeightedSumAll/totalQtyAllSuppliers;
      blendedQty = totalQtyAllSuppliers;
    }
    if(blended!==null){
      const saving = blended - ranked[0][1];
      if(saving > 0.01){
        cards.push({ label:`Savings Potential${useCompanyScoped?' — Ours':''}`, value:`${fmtPricePerKg(saving)}${state.showUsd?" $/KG":" PKR/KG"}`, note: useCompanyScoped ? "vs. cheapest available, our own blended cost" : "vs. cheapest supplier, whole-market blended" });
      }
    }
  }

  // Supplier diversification — how many suppliers THIS company actually bought from for this
  // item, not how many suppliers exist market-wide (a whole-market count doesn't tell a
  // director anything about their OWN sourcing risk).
  if(useCompanyScoped){
    const ourSuppliers = mapping.supplier ? aggregateBy(ourRowsOnly, mapping.supplier, mapping, companyKey) : [];
    if(ourSuppliers.length>0){
      cards.push({ label:"Suppliers Used — Ours", value:`${ourSuppliers.length}`, note: ourSuppliers.length<=2 ? "low diversification" : "distinct suppliers, our own purchases" });
    }
  } else if(allSuppliersByVolume.length>0){
    cards.push({ label:"Suppliers Used", value:`${allSuppliersByVolume.length}`, note: (allSuppliersByVolume.length<=2 ? "low diversification" : "distinct suppliers matched") + " (whole market)" });
  }

  // Currency exposure — this company's OWN currency mix, not the whole market's.
  const curExpSummary = currencyExposure(useCompanyScoped ? ourRowsOnly : impRows, mapping);
  if(curExpSummary && curExpSummary.length>1){
    const top = curExpSummary[0];
    cards.push({ label:`Currency Exposure${useCompanyScoped?' — Ours':''}`, value:`${top.pct.toFixed(0)}% ${top.currency}`, note: (curExpSummary.length>1 ? `+${curExpSummary.length-1} other currenc${curExpSummary.length-1===1?"y":"ies"}` : "") + (useCompanyScoped?'':' (whole market)') });
  }

  // EFS vs Duty-Paid split — this company's OWN scheme mix, not the whole market's. Different
  // exemption mechanisms (SRO concession within Duty Paid vs the EFS scheme itself) explain
  // very different cost outcomes, and that only matters at the level of what WE actually filed under.
  if(mapping.gd){
    const schemeRows = useCompanyScoped ? ourRowsOnly : impRows;
    let hcQty = 0, fsQty = 0, otherQty = 0;
    schemeRows.forEach(r=>{
      const code = extractGdSchemeCode(r[mapping.gd]);
      const q = num(r[mapping.qty]);
      if(isNaN(q)) return;
      if(code === "HC") hcQty += q;
      else if(code === "FS") fsQty += q;
      else otherQty += q;
    });
    const schemeTotalQty = hcQty + fsQty + otherQty;
    if(schemeTotalQty > 0){
      const hcPct = hcQty/schemeTotalQty*100, fsPct = fsQty/schemeTotalQty*100;
      cards.push({ label:`Duty Paid vs EFS${useCompanyScoped?' — Ours':''}`, value:`${hcPct.toFixed(0)}% / ${fsPct.toFixed(0)}%`, note: "by volume, HC / FS schemes" + (useCompanyScoped?'':' (whole market)') });
    }
  }

  const cardsWrap = document.createElement("div");
  cardsWrap.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px;";
  cardsWrap.innerHTML = cards.map(c=>`
    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;">
      <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;">${escHtml(c.label)}</div>
      <div style="font-size:17px;font-weight:700;color:${c.color||'var(--text)'};margin-top:2px;">${c.value}</div>
      <div style="font-size:10.5px;color:var(--text-dim);margin-top:1px;">${escHtml(c.note)}</div>
    </div>`).join("");
  wrap.appendChild(cardsWrap);

  // ---- Footer badges: currency exposure + match confidence, kept to one line each ----
  const footer = document.createElement("div");
  footer.style.marginTop = "10px";
  const curExp = currencyExposure(impRows, mapping);
  const conf = matchConfidenceStats("import", item, "hs");
  const lines = [];
  if(curExp && curExp.length>1){
    lines.push(`Currency mix: ${curExp.map(c=>`${c.pct<0.1&&c.pct>0?'<0.1':c.pct.toFixed(0)}% ${escHtml(c.currency)}`).join(", ")}`);
  }
  if(conf){
    lines.push(conf.descOnly===0 ? `✓ ${conf.total} rows, 100% HS-confirmed` : `⚠ ${conf.descOnly} of ${conf.total} rows unconfirmed by HS Code`);
  }
  footer.innerHTML = lines.map(l=>`<div class="empty-note">${l}</div>`).join("");
  wrap.appendChild(footer);

  return wrap;
}

// Excludes rows belonging to our own company (if named) from a ranking comparison set — once
// our real data appears in the uploaded file (common, since customs data covers everyone), we'd
// otherwise be compared against ourselves: once via our real row, once via the manual "our
// position" entry, double-counting and skewing both the rank and the "of N" denominator.
function excludeOurCompany(rows, mapping, roleKey, companyName){
  const name = companyName!==undefined ? companyName : state.ourCompanyName;
  if(!name || !name.trim()) return rows;
  const col = mapping[roleKey];
  if(!col) return rows;
  const ourKey = companyKey(name);
  return rows.filter(r => companyKey(r[col]) !== ourKey);
}

// Prefers our own company's REAL aggregated qty/price from the uploaded data over the
// manually-typed "our position" entry, whenever "Our company name" is set and actually shows
// up in this item's matched rows — real data can't go stale the way a manual number typed
// once and forgotten can. Falls back to the manual entry only when there's no real row to use
// (e.g. an item we genuinely don't import, so there's nothing to look up).
function ourQtyAndPrice(rows, mapping, manual, companyName){
  const name = companyName!==undefined ? companyName : state.ourCompanyName;
  if(name && name.trim() && mapping.importer){
    const ourKey = companyKey(name);
    const ourRow = aggregateBy(rows, mapping.importer, mapping, companyKey).find(([n])=>companyKey(n)===ourKey);
    if(ourRow){
      return { qty: ourRow[1].qty, priceAvg: ourRow[1].priceAvg, currency: ourRow[1].currency, source: "real" };
    }
  }
  const q = manualQtyKg(manual);
  if(isNaN(q)) return null;
  return { qty: q, priceAvg: num(manual.price), currency: manual.currency, source: "manual" };
}

function rankBanner(item, manual, impRows, mapping){
  const d = document.createElement("div");
  if(!mapping){
    d.className = "empty-note";
    d.textContent = "Enter our quantity to see our rank by volume.";
    return d;
  }
  if(!mapping.importer || !mapping.qty){
    d.className = "empty-note";
    d.textContent = "Map the Importer and Quantity columns to see our rank by volume.";
    return d;
  }
  const ourData = ourQtyAndPrice(impRows, mapping, manual);
  if(!ourData){
    d.className = "empty-note";
    d.textContent = "Enter our quantity to see our rank by volume.";
    return d;
  }
  const rowsForRanking = excludeOurCompany(impRows, mapping, "importer");
  const byImporter = aggregateBy(rowsForRanking, mapping.importer, mapping, companyKey);
  const ourQty = ourData.qty;
  if(isNaN(ourQty) || byImporter.length===0){
    d.className = "empty-note";
    d.textContent = "Enter a valid quantity to see our rank by volume.";
    return d;
  }
  const allQtys = [...byImporter.map(([,v])=>v.qty), ourQty].sort((a,b)=>b-a); // descending: largest buyer = #1
  const qtyRank = allQtys.indexOf(ourQty) + 1;

  d.className = "rank-banner";
  let html = `By <b>quantity</b> (our priority metric), we are ranked <b>#${qtyRank}</b> of ${allQtys.length} among matched importers — largest buyer = #1${ourData.source==="real"?" <span style=\"color:var(--good);\">(using our actual matched data, not a manual entry)</span>":""}.`;

  if(mapping.price && ourData.priceAvg!==null && !isNaN(ourData.priceAvg)){
    const { prices, currency } = dominantCurrencyPrices(excludeOurCompany(impRows, mapping, "importer"), mapping);
    if(prices.length>0){
      const allPrices = [...prices, ourData.priceAvg].sort((a,b)=>a-b);
      const priceRank = allPrices.indexOf(ourData.priceAvg) + 1;
      html += ` By <b>unit price</b>, we're ranked <b>#${priceRank}</b> of ${allPrices.length} (lowest = #1)${currency?` — compared in ${escHtml(currency)} only`:""}.`;
    }
  }
  html += `<span class="note">Ranking compares against the "Import Customs Data" file only, on the mapped HS Code + Quantity/Unit Price columns${state.ourCompanyName?`, excluding rows for "${escHtml(state.ourCompanyName)}" so we're not compared against ourselves`:""}. Records only match to the 6-digit HS heading if an exact code isn't found — treat matches at that level as a category benchmark, not an exact product comparison.</span>`;
  d.innerHTML = html;
  return d;
}

async function saveManual(uid){
  const qty = document.getElementById("m-qty").value;
  const price = document.getElementById("m-price").value;
  const currency = document.getElementById("m-currency").value;
  const supplier = document.getElementById("m-supplier").value;
  state.manual[uid] = {qty, price, currency, supplier};
  try{
    await storageBackend.set("manual:all", JSON.stringify(state.manual), false);
  }catch(e){ console.error(e); }

function buildSeries(rows, mapping){
  if(!mapping || !mapping.price) return [];
  return rows
    .map(r=>({ date: rowDate(r, mapping), price: num(r[mapping.price]) }))
    .filter(p=>p.date && !isNaN(p.price))
    .sort((a,b)=>a.date-b.date);
}

// Reusable horizontal bar chart — director asked for graph views wherever a comparison table
// exists, since bars are faster to scan than a column of numbers. items: [{label, value, highlight?}]
// sorted by the caller in whatever order they want bars to appear top-to-bottom.
function barChartSvg(items, opts){
  opts = opts || {};
  const valueFormatter = opts.valueFormatter || (v => v.toLocaleString(undefined,{maximumFractionDigits:2}));
  const barColor = opts.barColor || "#c99a4a";
  const highlightColor = opts.highlightColor || "#4a9d84";
  if(!items || items.length===0) return "";

  const W = 700, rowH = 30, padL = 4, padR = 90, labelW = 200, gap = 6;
  const H = items.length * (rowH+gap) + 10;
  const maxVal = Math.max(...items.map(it=>it.value), 0.0001);
  const barAreaW = W - labelW - padR - padL;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;font-family:inherit;">`;
  items.forEach((it, i)=>{
    const y = i*(rowH+gap) + 5;
    const barW = Math.max(2, (it.value/maxVal) * barAreaW);
    const color = it.highlight ? highlightColor : barColor;
    const label = String(it.label).length > 28 ? String(it.label).slice(0,26)+"…" : String(it.label);
    svg += `<title>${escHtml(String(it.label))}: ${escHtml(valueFormatter(it.value))}</title>`;
    svg += `<text x="${padL}" y="${y+rowH/2+4}" fill="#c7cfd9" font-size="11">${escHtml(label)}</text>`;
    svg += `<rect x="${labelW}" y="${y}" width="${barW.toFixed(1)}" height="${rowH}" rx="3" fill="${color}" opacity="0.88"/>`;
    svg += `<text x="${labelW+barW+6}" y="${y+rowH/2+4}" fill="#e8ecf1" font-size="11" font-weight="600">${escHtml(valueFormatter(it.value))}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function trendChartEl(impRows, expRows, witsRows, manual){
  const series = [
    { label:"Import (customs)", color:"#c99a4a", points: buildSeries(impRows, state.files.import?.mapping) },
    { label:"Export (customs)", color:"#4a9d84", points: buildSeries(expRows, state.files.export?.mapping) },
    { label:"Global WITS", color:"#7a8fd0", points: buildSeries(witsRows, state.files.wits?.mapping) },
  ].filter(s=>s.points.length>0);

  const ourPrice = num(manual.price);
  const hasOur = !isNaN(ourPrice);

  if(series.length===0 && !hasOur){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = "Upload and map at least one dated price field (import, export, or WITS) to see a price trend. Enter our unit price above to at least show a reference line.";
    return p;
  }

  const allPoints = series.flatMap(s=>s.points);
  const W=880, H=290, padL=64, padR=20, padT=16, padB=48;

  let minT, maxT;
  if(allPoints.length){
    minT = Math.min(...allPoints.map(p=>p.date.getTime()));
    maxT = Math.max(...allPoints.map(p=>p.date.getTime()));
  } else { minT = Date.now()-1; maxT = Date.now(); }
  if(minT===maxT){ minT -= 1000*60*60*24*30; }

  let prices = allPoints.map(p=>p.price);
  if(hasOur) prices = prices.concat([ourPrice]);
  let minP = Math.min(...prices), maxP = Math.max(...prices);
  if(minP===maxP){ minP -= 1; maxP += 1; }
  const pad = (maxP-minP)*0.1;
  minP -= pad; maxP += pad;

  const x = t => padL + (t-minT)/(maxT-minT) * (W-padL-padR);
  const y = p => H-padB - (p-minP)/(maxP-minP) * (H-padT-padB);

  const dateFmt = t => new Date(t).toLocaleDateString(undefined,{month:"short", year:"2-digit"});

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">`;

  // light horizontal gridlines at 25/50/75% for readability
  [0.25,0.5,0.75].forEach(f=>{
    const gy = padT + f*(H-padT-padB);
    svg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="#232a33" stroke-width="1"/>`;
  });

  // axes
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#333b46"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#333b46"/>`;
  svg += `<text x="${padL}" y="${H-padB+18}" fill="#8c97a6" font-size="10">${dateFmt(minT)}</text>`;
  svg += `<text x="${W-padR}" y="${H-padB+18}" fill="#8c97a6" font-size="10" text-anchor="end">${dateFmt(maxT)}</text>`;
  svg += `<text x="${padL-8}" y="${y(maxP)+4}" fill="#8c97a6" font-size="10" text-anchor="end">${maxP.toFixed(1)}</text>`;
  svg += `<text x="${padL-8}" y="${y(minP)+4}" fill="#8c97a6" font-size="10" text-anchor="end">${minP.toFixed(1)}</text>`;

  // axis titles
  svg += `<text x="${(padL+(W-padR))/2}" y="${H-8}" fill="#6b7480" font-size="10.5" text-anchor="middle">Shipment date →</text>`;
  svg += `<text x="16" y="${(padT+(H-padB))/2}" fill="#6b7480" font-size="10.5" text-anchor="middle" transform="rotate(-90 16 ${(padT+(H-padB))/2})">Unit price ↑</text>`;

  series.forEach(s=>{
    const path = s.points.map((p,i)=>`${i===0?'M':'L'} ${x(p.date.getTime()).toFixed(1)} ${y(p.price).toFixed(1)}`).join(" ");
    svg += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    s.points.forEach(p=>{
      svg += `<circle cx="${x(p.date.getTime()).toFixed(1)}" cy="${y(p.price).toFixed(1)}" r="2.5" fill="${s.color}"/>`;
    });
  });

  if(hasOur){
    svg += `<line x1="${padL}" y1="${y(ourPrice).toFixed(1)}" x2="${W-padR}" y2="${y(ourPrice).toFixed(1)}" stroke="#e7ecf2" stroke-width="1.5" stroke-dasharray="5,4"/>`;
    svg += `<text x="${W-padR}" y="${y(ourPrice)-6}" fill="#e7ecf2" font-size="10" text-anchor="end">Our price: ${ourPrice}</text>`;
  }
  svg += `</svg>`;

  const legend = series.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px;font-size:11px;color:var(--text-dim);">
      <span style="width:9px;height:9px;border-radius:2px;background:${s.color};display:inline-block;"></span>${s.label} (${s.points.length} shipment${s.points.length===1?"":"s"})
    </span>`).join("") + (hasOur ? `<span style="font-size:11px;color:var(--text-dim);">- - - Our price</span>` : "");

  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div style="margin-bottom:8px;">${legend}</div>
    ${svg}
    <div class="empty-note" style="margin-top:6px;">Vertical axis is unit price, horizontal axis is shipment date — each dot is one matched shipment, not an average.</div>
  `;
  return wrap;
}
function buildInsightsBullets(item, manual, impRows, expRows, witsRows){
  const impMapping = state.files.import?.mapping;
  const expMapping = state.files.export?.mapping;
  const ourPrice = num(manual.price);
  const bullets = [];

  // Import-side price position
  let impAvg = null, impMin = null;
  if(impMapping?.price && impRows.length){
    const { prices, pairs, currency: impCur, excluded: impExcluded } = dominantCurrencyPrices(impRows, impMapping);
    if(prices.length){
      impAvg = weightedAverage(pairs);
      impMin = Math.min(...prices);
      const impMax = Math.max(...prices);
      const curSuffix = impCur ? ` ${impCur}` : "";
      const excludedNote = impExcluded>0 ? ` (${impExcluded} shipment${impExcluded===1?"":"s"} in a different currency excluded)` : "";
      if(!isNaN(ourPrice)){
        const diffPct = ((ourPrice-impAvg)/impAvg*100);
        bullets.push(`Our price (${ourPrice}${curSuffix}) is ${Math.abs(diffPct).toFixed(1)}% ${diffPct>=0?"above":"below"} the quantity-weighted average matched import price of ${impAvg.toFixed(2)}${curSuffix} across ${prices.length} shipment${prices.length===1?"":"s"}${excludedNote}.`);
        const gapToMin = impMin>0 ? ((ourPrice-impMin)/impMin*100) : 0;
        if(gapToMin>1){
          bullets.push(`The cheapest matched import price is ${impMin.toFixed(2)}${curSuffix} — ${gapToMin.toFixed(1)}% below what we're currently paying.`);
        }
      } else {
        bullets.push(`Matched import prices for this item range from ${impMin.toFixed(2)} to ${impMax.toFixed(2)}${curSuffix}, averaging ${impAvg.toFixed(2)}${excludedNote}. Enter our current price above for a direct comparison.`);
      }
    }
  } else if(impRows.length===0 && state.files.import){
    bullets.push("No matched import records for this item — check the HS Code / Item Description mapping, or this item may not appear in the uploaded import file.");
  }

  // Trend
  const trend = buildSeries(impRows, impMapping);
  if(trend.length>=2){
    const dir = trend[trend.length-1].price > trend[0].price ? "risen" : trend[trend.length-1].price < trend[0].price ? "fallen" : "stayed flat";
    bullets.push(`Import price has ${dir} over the selected period — from ${trend[0].price.toFixed(2)} to ${trend[trend.length-1].price.toFixed(2)}.`);
  }

  // Top competitor by volume
  if(impMapping?.importer && impMapping?.qty && impRows.length){
    const top = aggregateBy(impRows, impMapping.importer, impMapping, companyKey)[0];
    if(top){
      bullets.push(`Largest matched importer by volume: ${top[0]} (avg price ${top[1].priceAvg!==null ? top[1].priceAvg.toFixed(2) : "n/a"}).`);
    }
  }

  // Export side
  if(expMapping?.price && expRows.length){
    const { prices, pairs, currency: expCur } = dominantCurrencyPrices(expRows, expMapping);
    if(prices.length){
      const avg = weightedAverage(pairs);
      bullets.push(`Matched export records average ${avg.toFixed(2)}${expCur?` ${expCur}`:""} (quantity-weighted) across ${prices.length} shipment${prices.length===1?"":"s"}.`);
    }
  }

  // Recommendation
  if(!isNaN(ourPrice) && impAvg!==null){
    const diffPct = ((ourPrice-impAvg)/impAvg*100);
    if(diffPct > 5){
      bullets.push(`Recommendation: our price sits meaningfully above the matched market average — worth renegotiating with the current supplier or sourcing a competitive quote.`);
    } else if(diffPct < -5){
      bullets.push(`Recommendation: current pricing is favorable versus the matched market — maintain the supplier relationship and keep monitoring.`);
    } else {
      bullets.push(`Recommendation: pricing is broadly in line with the matched market — no urgent action, continue monitoring.`);
    }
  }

  if(bullets.length===0){
    bullets.push("Not enough matched data yet to draft insights — upload customs data, confirm the item's HS Code / Item Description mapping, and enter our current price above.");
  }

  return bullets.slice(0,6);
}

function generateInsights(item, manual, impRows, expRows, witsRows){
  const holder = document.getElementById("insights-holder");
  const bullets = buildInsightsBullets(item, manual, impRows, expRows, witsRows);
  const text = bullets.join("\n");
  state.lastInsightsText[item.uid] = text;
  holder.innerHTML = `
    <button class="btn small" id="insights-btn">Regenerate</button>
    <ul style="margin:10px 0 0 18px; padding:0; font-size:12.5px; line-height:1.7;">
      ${bullets.map(b=>`<li>${escHtml(b)}</li>`).join("")}
    </ul>
    <div class="empty-note" style="margin-top:8px;">Auto-drafted from the figures above (rule-based, no external calls) — review before sharing.</div>
  `;
  document.getElementById("insights-btn").addEventListener("click", ()=>generateInsights(item, manual, impRows, expRows, witsRows));
}

function dataUrlToUint8Array(dataUrl){
  const base64 = dataUrl.split(",")[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Renders the price trend as a PNG (canvas, not SVG) so it can be embedded as a picture in the PPTX.
function drawTrendCanvasPng(impRows, expRows, witsRows, manual){
  const series = [
    { label:"Import (customs)", color:"#C99A4A", points: buildSeries(impRows, state.files.import?.mapping) },
    { label:"Export (customs)", color:"#2E7D67", points: buildSeries(expRows, state.files.export?.mapping) },
    { label:"Global WITS", color:"#3B5BA6", points: buildSeries(witsRows, state.files.wits?.mapping) },
  ].filter(s=>s.points.length>0);
  const ourPrice = num(manual.price);
  const hasOur = !isNaN(ourPrice);
  if(series.length===0 && !hasOur) return null;

  const allPoints = series.flatMap(s=>s.points);
  const W=1400, H=560, padL=90, padR=40, padT=40, padB=70;
  let minT, maxT;
  if(allPoints.length){ minT = Math.min(...allPoints.map(p=>p.date.getTime())); maxT = Math.max(...allPoints.map(p=>p.date.getTime())); }
  else { minT = Date.now()-1; maxT = Date.now(); }
  if(minT===maxT) minT -= 1000*60*60*24*30;
  let prices = allPoints.map(p=>p.price);
  if(hasOur) prices = prices.concat([ourPrice]);
  let minP = Math.min(...prices), maxP = Math.max(...prices);
  if(minP===maxP){ minP -= 1; maxP += 1; }
  const pad = (maxP-minP)*0.1; minP -= pad; maxP += pad;
  const x = t => padL + (t-minT)/(maxT-minT) * (W-padL-padR);
  const y = p => H-padB - (p-minP)/(maxP-minP) * (H-padT-padB);
  const dateFmt = t => new Date(t).toLocaleDateString(undefined,{month:"short", year:"2-digit"});

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#D0D5DD"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL,H-padB); ctx.lineTo(W-padR,H-padB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,H-padB); ctx.stroke();
  ctx.fillStyle = "#6B7280"; ctx.font = "20px Arial";
  ctx.fillText(dateFmt(minT), padL, H-padB+32);
  ctx.textAlign = "right";
  ctx.fillText(dateFmt(maxT), W-padR, H-padB+32);
  ctx.fillText(maxP.toFixed(1), padL-12, y(maxP)+6);
  ctx.fillText(minP.toFixed(1), padL-12, y(minP)+6);
  ctx.textAlign = "left";

  series.forEach(s=>{
    ctx.strokeStyle = s.color; ctx.lineWidth = 3;
    ctx.beginPath();
    s.points.forEach((p,i)=>{
      const px=x(p.date.getTime()), py=y(p.price);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    });
    ctx.stroke();
    ctx.fillStyle = s.color;
    s.points.forEach(p=>{
      ctx.beginPath(); ctx.arc(x(p.date.getTime()), y(p.price), 4.5, 0, Math.PI*2); ctx.fill();
    });
  });

  if(hasOur){
    ctx.strokeStyle = "#1A1A1A"; ctx.lineWidth = 2; ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.moveTo(padL, y(ourPrice)); ctx.lineTo(W-padR, y(ourPrice)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#1A1A1A"; ctx.textAlign = "right";
    ctx.fillText(`Our price: ${ourPrice}`, W-padR, y(ourPrice)-10);
    ctx.textAlign = "left";
  }

  let lx = padL;
  ctx.font = "18px Arial";
  series.forEach(s=>{
    ctx.fillStyle = s.color;
    ctx.fillRect(lx, 6, 14, 14);
    ctx.fillStyle = "#1A1A1A";
    ctx.fillText(s.label, lx+20, 19);
    lx += ctx.measureText(s.label).width + 60;
  });

  return canvas.toDataURL("image/png");
}

    <a:tcPr anchor="ctr">${border}<a:solidFill><a:srgbClr val="1F3864"/></a:solidFill></a:tcPr></a:tc>`).join("")}</a:tr>`;
  const bodyRows = rows.map((r,ri)=>`<a:tr h="${rowH}">${r.map(cell=>`
    <a:tc><a:txBody><a:bodyPr/><a:lstStyle/><a:p><a:r><a:rPr lang="en-US" sz="1050"><a:solidFill><a:srgbClr val="222222"/></a:solidFill></a:rPr><a:t>${pptxEsc(cell)}</a:t></a:r></a:p></a:txBody>
    <a:tcPr anchor="ctr">${border}<a:solidFill><a:srgbClr val="${ri%2===0?'FFFFFF':'F5F7FA'}"/></a:solidFill></a:tcPr></a:tc>`).join("")}</a:tr>`).join("");
  const totalH = rowH * (rows.length+1);
  return `<p:graphicFrame>
<p:nvGraphicFramePr><p:cNvPr id="${id}" name="Table ${id}"/><p:cNvGraphicFramePr><a:graphicFrameLocks noGrp="1"/></p:cNvGraphicFramePr><p:nvPr/></p:nvGraphicFramePr>
<p:xfrm><a:off x="${x}" y="${y}"/><a:ext cx="${w}" cy="${totalH}"/></p:xfrm>
<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/table">
<a:tbl><a:tblPr firstRow="1" bandRow="1"/><a:tblGrid>${grid}</a:tblGrid>
${headerRow}
${bodyRows}
</a:tbl>
</a:graphicData></a:graphic>
</p:graphicFrame>`;
}
function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }

// Compares the two most recent full months' quantity-weighted average price for this item —
// a quick "is this trending up or down" signal without having to read the whole price trend chart.
function monthOverMonthMovement(rows, mapping){
  if(!mapping || !mapping.price) return null;
  const byMonth = {};
  rows.forEach(r=>{
    const d = rowDate(r, mapping);
    if(!d) return;
    const p = num(r[mapping.price]);
    if(isNaN(p)) return;
    const q = mapping.qty ? num(r[mapping.qty]) : NaN;
    const mk = monthKey(d);
    if(!byMonth[mk]) byMonth[mk] = { sum:0, n:0, wsum:0, wqty:0 };
    byMonth[mk].sum += p; byMonth[mk].n++;
    if(!isNaN(q)){ byMonth[mk].wsum += p*q; byMonth[mk].wqty += q; }
  });
  const months = Object.keys(byMonth).sort();
  if(months.length < 2) return null;
  const latest = months[months.length-1];
  const prior = months[months.length-2];
  const avgFor = mk => byMonth[mk].wqty>0 ? byMonth[mk].wsum/byMonth[mk].wqty : (byMonth[mk].n ? byMonth[mk].sum/byMonth[mk].n : null);
  const latestAvg = avgFor(latest), priorAvg = avgFor(prior);
  if(latestAvg===null || priorAvg===null || priorAvg===0) return null;
  return { latestMonth: latest, priorMonth: prior, latestAvg, priorAvg, pctChange: (latestAvg-priorAvg)/priorAvg*100 };
}

function monthLabel(mk){
  const [y,m] = mk.split("-");
  return new Date(parseInt(y), parseInt(m)-1, 1).toLocaleString("en-US",{month:"long"}) + "-" + String(y).slice(2);
}

// Matches a raw row value to whichever of a set of (already-merged) display names shares its
// normalized company key — used wherever rows need bucketing against a "top N companies" list
// that aggregateBy already computed, since that list now holds pretty display names, not keys.
function matchCompanyName(rawName, displayNames){
  const k = companyKey(rawName);
  return displayNames.find(n => companyKey(n) === k) || null;
}

// For a given company (e.g. one importer), breaks its matched rows down by counterparty
// (e.g. supplier) — qty (KG, converted to MT at display time), quantity-weighted avg price,
// and origin(s). Shared by the "Last importer data" cards and the "Top Importers" expandable
// rows so both present identical, consistent breakdowns rather than two separate logics.
function counterpartyBreakdown(rows, mapping, companyRole, companyName, counterpartyRole, originRole, monthFilter){
  const companyCol = mapping[companyRole];
  const counterpartyCol = mapping[counterpartyRole];
  if(!companyCol || !counterpartyCol) return [];
  const originCol = originRole ? mapping[originRole] : null;
  const priceCol = mapping.price, qtyCol = mapping.qty;

  const filtered = rows.filter(r => {
    if(companyKey(r[companyCol]) !== companyKey(companyName)) return false;
    if(monthFilter){
      const d = rowDate(r, mapping);
      if(!d || monthKey(d) !== monthFilter) return false;
    }
    return true;
  });
  const agg = {};
  filtered.forEach(r=>{
    const raw = r[counterpartyCol] || "(unspecified)";
    const key = companyKey(raw);
    if(!agg[key]) agg[key] = { qty:0, weightedSum:0, n:0, priceSum:0, origins:new Set(), nameCounts:{}, currency:null };
    agg[key].nameCounts[raw] = (agg[key].nameCounts[raw]||0) + 1;
    const q = num(r[qtyCol]);
    const p = num(r[priceCol]);
    if(!isNaN(q)) agg[key].qty += q;
    if(!isNaN(p)){
      agg[key].n++; agg[key].priceSum += p;
      if(!isNaN(q)){ agg[key].weightedSum += p*q; }
    }
    if(!agg[key].currency && mapping.currency && r[mapping.currency]) agg[key].currency = r[mapping.currency];
    if(originCol && r[originCol]) agg[key].origins.add(String(r[originCol]).trim());
  });

  return Object.entries(agg).map(([key,v])=>{
    let displayName = key, best = 0;
    Object.entries(v.nameCounts).forEach(([raw,c])=>{ if(c>best || (c===best && raw.length>displayName.length)){ displayName=raw; best=c; } });
    const avgPrice = v.qty>0 ? v.weightedSum/v.qty : (v.n ? v.priceSum/v.n : null);
    const variants = Object.keys(v.nameCounts);
    return {
      name: displayName, qty: v.qty, avgPrice, currency: v.currency,
      origins: [...v.origins], shipments: v.n,
      mergedVariants: variants.length>1 ? variants : null,
    };
  }).sort((a,b)=>b.qty-a.qty);
}

// Renders a counterpartyBreakdown() result as a clean small table.
function breakdownTableHtml(items, counterpartyLabel, showOrigin){
  if(items.length===0) return `<div class="empty-note" style="padding:6px 0;">No breakdown data available.</div>`;
  return `
    <table class="data-table" style="margin-top:4px;">
      <tr>
        <th style="text-align:left;">${escHtml(counterpartyLabel)}</th>
        ${showOrigin ? '<th>Origin</th>' : ''}
        <th>Qty (MT)</th>
        <th>Unit Price (per KG)</th>
        <th>Shipments</th>
      </tr>
      ${items.map(it=>{
        const infoMark = it.mergedVariants
          ? ` <span title="${escHtml(`Merged from ${it.mergedVariants.length} spellings in the source file:\n` + it.mergedVariants.join("\n"))}" style="cursor:help;color:var(--text-dim);font-size:11px;">ⓘ</span>`
          : "";
        return `
        <tr>

          ${showOrigin ? `<td>${escHtml(it.origins.slice(0,2).join(", ") || "—")}${it.origins.length>2?` +${it.origins.length-2}`:""}</td>` : ''}
          <td class="num">${fmtQtyMt(it.qty)}</td>

}

// Month x Company price matrix — mirrors the "India/Pakistan Imports Pricing" table format from the reference deck
function monthlyPivot(rows, mapping, companyRole, topN){
  const nameCol = mapping && mapping[companyRole];
  if(!nameCol || !mapping.price) return null;
  const topCompanies = aggregateBy(rows, nameCol, mapping, companyKey).slice(0, topN).map(([n])=>n);
  if(topCompanies.length===0) return null;
  const pivot = {};
  const currencyCounts = {}; // company -> {currency: count}
  topCompanies.forEach(c => currencyCounts[c] = {});
  rows.forEach(r=>{
    const name = matchCompanyName(r[nameCol], topCompanies);
    if(!name) return;
    const d = rowDate(r, mapping);
    if(!d) return;
    const p = num(r[mapping.price]);
    if(isNaN(p)) return;
    const q = num(r[mapping.qty]);
    const mk = monthKey(d);
    pivot[mk] = pivot[mk] || {};
    pivot[mk][name] = pivot[mk][name] || {sum:0, n:0, weightedSum:0, weightedQty:0};
    pivot[mk][name].sum += p;
    pivot[mk][name].n += 1;
    if(!isNaN(q)){ pivot[mk][name].weightedSum += p*q; pivot[mk][name].weightedQty += q; }
    if(mapping.currency && r[mapping.currency]){
      const c = r[mapping.currency];
      currencyCounts[name][c] = (currencyCounts[name][c]||0) + 1;
    }
  });
  const companyCurrency = {};
  topCompanies.forEach(c=>{
    const counts = currencyCounts[c];
    let best = null, bestN = 0;
    Object.entries(counts).forEach(([cur,n])=>{ if(n>bestN){ best=cur; bestN=n; } });
    companyCurrency[c] = best;
  });
  const months = Object.keys(pivot).sort().slice(-6); // most recent 6 months with any data
  if(months.length===0) return null;
  let cheapest = null;
  months.forEach(mk=>{
    topCompanies.forEach(c=>{
      if(pivot[mk][c]){
        const cell = pivot[mk][c];
        const avg = cell.weightedQty>0 ? cell.weightedSum/cell.weightedQty : cell.sum/cell.n;
        if(!cheapest || avg < cheapest.price) cheapest = { name:c, price:avg, currency:companyCurrency[c] };
      }
    });
  });
  const headers = ["Month", ...topCompanies.map(c => companyCurrency[c] ? `${c} (${companyCurrency[c]})` : c)];
  const bodyRows = months.map(mk => [
    monthLabel(mk),
    ...topCompanies.map(c => {
      const cell = pivot[mk][c];
      if(!cell) return "—";
      const avg = cell.weightedQty>0 ? cell.weightedSum/cell.weightedQty : cell.sum/cell.n;
      return avg.toFixed(2);
    })
  ]);
  return { headers, rows: bodyRows, cheapest };
}

// ---------- Landed cost (from actual paid duties/taxes in the customs file) ----------
// Pakistan Customs data carries the real amounts already paid per shipment — not statutory rates,
// actual paid figures (post-SRO-exemption). Summing these plus the PKR import value gives a true
// per-unit landed cost, without needing a separate duty-rate calculator or manual column mapping.
const LANDED_COST_FIELD_CANDIDATES = {
  importValuePkr: ["Import Value in PKR"],
  paidCustomsDuty: ["Paid Customs Duty"],
  paidSalesTax: ["Paid Sales Tax"],           // detected but NOT included — see LANDED_COST_EXCLUDED_KEYS
  paidIncomeTax: ["Paid Income Tax"],         // detected but NOT included
  additionalSalesTax: ["Additional Sales Tax"], // detected but NOT included
  additionalCustomsDuty: ["Additional Customs Duty"],
  fed: ["Federal Excise Duty"],
  specialFed: ["Special FED"],
  otherTaxes: ["Other Taxes"],
};

// Columns actually summed into landed cost. Sales Tax and Income Tax are deliberately
// excluded: Sales Tax is a recoverable input tax credit for a registered business (not a
// real cost — it's reclaimed against output tax), and Income Tax withheld at import is an
// advance payment against the importer's own income tax liability, not a cost of the goods.
// Customs Duty and FED are non-recoverable and genuinely embedded in the landed cost.
const LANDED_COST_INCLUDED_KEYS = ["paidCustomsDuty","additionalCustomsDuty","fed","specialFed","otherTaxes"];
const LANDED_COST_EXCLUDED_KEYS = ["paidSalesTax","paidIncomeTax","additionalSalesTax"];

function detectLandedCostColumns(headers){
  if(!headers) return {};
  const found = {};
  Object.entries(LANDED_COST_FIELD_CANDIDATES).forEach(([key, candidates])=>{
    const match = headers.find(h => candidates.some(c => String(h).trim().toLowerCase() === c.trim().toLowerCase()));
    if(match) found[key] = match;
  });
  return found;
}

// Human-readable formula for whichever columns are actually present in this file — shown
// on screen and in the PPT so the calculation isn't a black box for a director/layman.
function landedCostFormulaText(cols){
  const labels = { paidCustomsDuty:"Paid Customs Duty", additionalCustomsDuty:"Additional Customs Duty",
    fed:"Federal Excise Duty", specialFed:"Special FED", otherTaxes:"Other Taxes" };
  const parts = ["Import Value in PKR"];
  LANDED_COST_INCLUDED_KEYS.forEach(k=>{ if(cols[k]) parts.push(labels[k]); });
  const formula = parts.join(" + ") + "  ÷  Quantity";
  const exclLabels = { paidSalesTax:"Sales Tax", paidIncomeTax:"Income Tax", additionalSalesTax:"Additional Sales Tax" };
  const excludedPresent = LANDED_COST_EXCLUDED_KEYS.filter(k=>cols[k]);
  let note = "";
  if(excludedPresent.length){
    note = ` Sales Tax and Income Tax (${excludedPresent.map(k=>exclLabels[k]).join(", ")}) are intentionally `
         + `excluded — Sales Tax is a recoverable input tax credit and Income Tax withheld at import is an `
         + `advance against the company's own tax liability, so neither is a real cost of the goods. Customs `
         + `Duty and FED are non-recoverable, so they're included.`;
  }
  return { formula, note };
}

function landedCostPerUnit(row, cols, qty, mapping){
  if(!cols.importValuePkr || !qty || qty<=0) return null;
  let total = num(row[cols.importValuePkr]);
  if(isNaN(total)) return null;
  LANDED_COST_INCLUDED_KEYS.forEach(k=>{
    if(cols[k]){
      const v = num(row[cols[k]]);
      if(!isNaN(v)) total += v;
    }
  });
  let perUnit = total/qty;
  // Landed cost is computed from "Import Value in PKR" + duty columns, which are always PKR
  // regardless of the shipment's own quoted currency — so converting it to USD needs the PKR
  // rate specifically, on that shipment's own date, not the row's Currency/price conversion above.
  if(state.showUsd && state.fxRates && mapping){
    const d = rowDate(row, mapping);
    const dateStr = d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` : null;
    const usdVal = convertToUsdOnDate(perUnit, "Rs.", dateStr, state.fxRates);
    if(usdVal !== null) perUnit = usdVal;
    // if conversion fails (date unresolvable), fall through and keep the PKR value rather than lose the row
  }
  return perUnit;
}

// Landed cost trend, month over month — separate from the plain unit-price trend, since duty/SRO
// treatment can shift even when declared price doesn't (e.g. an exemption expiring). Uses the
// same landedCostPerUnit calculation as the ranking table, quantity-weighted by month.
function landedCostMonthOverMonth(rows, mapping, headers){
  const cols = detectLandedCostColumns(headers);
  if(!cols.importValuePkr || !mapping.qty) return null;
  const byMonth = {};
  rows.forEach(r=>{
    const d = rowDate(r, mapping);
    if(!d) return;
    const q = num(r[mapping.qty]);
    if(isNaN(q) || q<=0) return;
    const lc = landedCostPerUnit(r, cols, q, mapping);
    if(lc===null || isNaN(lc)) return;
    const mk = monthKey(d);
    if(!byMonth[mk]) byMonth[mk] = { wsum:0, wqty:0 };
    byMonth[mk].wsum += lc*q;
    byMonth[mk].wqty += q;
  });
  const months = Object.keys(byMonth).sort();
  if(months.length < 2) return null;
  const latest = months[months.length-1];
  const prior = months[months.length-2];
  const avgFor = mk => byMonth[mk].wqty>0 ? byMonth[mk].wsum/byMonth[mk].wqty : null;
  const latestAvg = avgFor(latest), priorAvg = avgFor(prior);
  if(latestAvg===null || priorAvg===null || priorAvg===0) return null;
  return { latestMonth: latest, priorMonth: prior, latestAvg, priorAvg, pctChange: (latestAvg-priorAvg)/priorAvg*100 };
}

function detectSroColumns(headers){
  if(!headers) return [];
  return headers.filter(h => /^SRO-?\d*$/i.test(String(h).trim()));
}

function collectSroCodes(row, sroCols){
  const codes = new Set();
  sroCols.forEach(col=>{
    const v = row[col];
    if(v && String(v).trim()) codes.add(String(v).trim());
  });
  return codes;
}

// Pure data function — no DOM. Returns the same ranking landedCostTableEl displays, so any
// other view (like the summary dashboard) can reuse the exact same tested calculation instead
// of re-deriving it.
function computeLandedCostRanking(rows, mapping, headers, companyRole, item){
  const nameCol = mapping && mapping[companyRole];
  if(!nameCol || !mapping.qty) return { ranked: [], totalQtyAllSuppliers: 0, cols: null, sroCols: [], allSuppliersByVolume: [], actualWeightedSumAll: 0 };
  const cols = detectLandedCostColumns(headers);
  if(!cols.importValuePkr) return { ranked: [], totalQtyAllSuppliers: 0, cols: null, sroCols: [], allSuppliersByVolume: [], actualWeightedSumAll: 0 };
  const sroCols = detectSroColumns(headers);

  const hsCol = mapping.hs, descCol = mapping.desc;
  const agg = {};
  rows.forEach(r=>{
    const raw = r[nameCol];
    const name = companyKey(raw);
    const q = num(r[mapping.qty]);
    if(isNaN(q) || q<=0) return;
    const lc = landedCostPerUnit(r, cols, q, mapping);
    if(lc===null || isNaN(lc)) return;
    if(!agg[name]) agg[name] = { qty:0, weightedSum:0, nameCounts:{}, sroCodes:new Set(), descOnlyCount:0, totalCount:0, prices:[], dates:[] };
    agg[name].qty += q;
    agg[name].weightedSum += lc*q;
    agg[name].nameCounts[raw] = (agg[name].nameCounts[raw]||0) + 1;
    collectSroCodes(r, sroCols).forEach(c=>agg[name].sroCodes.add(c));
    agg[name].prices.push(lc);
    const d = rowDate(r, mapping);
    if(d) agg[name].dates.push(d);
    if(item){
      const descOk = descCol && descScore(item.name, r[descCol]) >= DESC_MATCH_THRESHOLD;
      const hsOk = hsCol && hsMatch(r[hsCol], item.hs, 8);
      agg[name].totalCount++;
      if(descOk && !hsOk) agg[name].descOnlyCount++;
    }
  });
  const totalQtyAllSuppliers = Object.values(agg).reduce((a,v)=>a+v.qty, 0);
  const actualWeightedSumAll = Object.values(agg).reduce((a,v)=>a+v.weightedSum, 0);
  const allSuppliersByVolume = Object.entries(agg)
    .map(([key,v])=>{
      let displayName = key, bestCount = 0;
      Object.entries(v.nameCounts).forEach(([raw,c])=>{ if(c>bestCount){ displayName=raw; bestCount=c; } });
      return [displayName, v.qty, totalQtyAllSuppliers>0 ? (v.qty/totalQtyAllSuppliers*100) : 0];
    })
    .sort((a,b)=>b[1]-a[1]);
  const ranked = Object.entries(agg)
    .map(([key,v])=>{
      let displayName = key, bestCount = 0;
      Object.entries(v.nameCounts).forEach(([raw,c])=>{ if(c>bestCount || (c===bestCount && raw.length>displayName.length)){ displayName=raw; bestCount=c; } });
      const pctOfVolume = totalQtyAllSuppliers>0 ? (v.qty/totalQtyAllSuppliers*100) : 0;

      // Price volatility — coefficient of variation (stddev / mean) across this supplier's
      // individual shipment landed costs. Two suppliers can share the same average but carry
      // very different risk: one steady, one swinging wildly shipment to shipment.
      let volatilityPct = null;
      if(v.prices.length >= 2){
        const mean = v.prices.reduce((a,p)=>a+p,0) / v.prices.length;
        const variance = v.prices.reduce((a,p)=>a+(p-mean)**2, 0) / v.prices.length;
        const stddev = Math.sqrt(variance);
        volatilityPct = mean>0 ? (stddev/mean*100) : null;
      }

      // Shipment-timing consistency — the largest gap in days between consecutive shipments.
      // A supplier with long unexplained gaps carries different supply-continuity risk than
      // one who ships on a steady cadence, even at the same total volume.
      let maxGapDays = null;
      if(v.dates.length >= 2){
        const sortedDates = [...v.dates].sort((a,b)=>a-b);
        let maxGap = 0;
        for(let i=1;i<sortedDates.length;i++){
          const gapDays = (sortedDates[i]-sortedDates[i-1]) / (1000*60*60*24);
          if(gapDays > maxGap) maxGap = gapDays;
        }
        maxGapDays = maxGap;
      }

      return [displayName, v.weightedSum/v.qty, v.qty, [...v.sroCodes], pctOfVolume, v.descOnlyCount, v.totalCount, volatilityPct, maxGapDays];
    })
    .filter(([,lc])=>!isNaN(lc))
    .sort((a,b)=>a[1]-b[1]) // cheapest landed cost first
    .slice(0,10);

  return { ranked, totalQtyAllSuppliers, cols, sroCols, allSuppliersByVolume, actualWeightedSumAll };
}

function landedCostTableEl(rows, mapping, headers, companyRole, companyLabel, item){
  const nameCol = mapping && mapping[companyRole];
  if(!nameCol || !mapping.qty){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = `Map the ${companyLabel} and Quantity columns to see duty-paid cost comparison.`;
    return p;
  }
  const { ranked, totalQtyAllSuppliers, cols, sroCols, allSuppliersByVolume, actualWeightedSumAll } = computeLandedCostRanking(rows, mapping, headers, companyRole, item);
  if(!cols){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = `This file doesn't have an "Import Value in PKR" column — duty-paid cost needs it to compute total paid cost per unit.`;
    return p;
  }

  if(ranked.length===0){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = "Couldn't compute duty-paid cost from the matched rows — check that quantity and PKR value fields have numeric data.";
    return p;
  }

  const wrap = document.createElement("div");

  // Concentration risk callout — computed from the single largest supplier by volume across
  // ALL matched suppliers (not just the top-10 cheapest shown below), since a director needs
  // to know about dependency risk regardless of whether that supplier is the cheapest one.
  const topByVolume = allSuppliersByVolume[0];
  if(topByVolume && topByVolume[2] >= 40){
    const riskNote = document.createElement("div");
    riskNote.style.cssText = "background:rgba(193,97,90,0.15);border:1px solid var(--bad);border-radius:6px;padding:8px 10px;margin-bottom:10px;font-size:12px;";
    riskNote.innerHTML = `⚠️ <strong>Concentration risk:</strong> ${escHtml(topByVolume[0])} accounts for <strong>${topByVolume[2].toFixed(0)}%</strong> of matched volume for this item. A disruption at this one supplier would affect the majority of this item's supply.`;
    wrap.appendChild(riskNote);
  }

  // Savings-if-switched — what the actual blended landed cost was across all matched volume,
  // versus what it would have been had 100% of that volume come from the cheapest supplier
  // shown below. Uses actual weighted landed cost, not list price, so this reflects real
  // duty/SRO treatment differences, not just quoted price differences.
  if(ranked.length >= 2 && totalQtyAllSuppliers > 0){
    const actualBlendedCost = actualWeightedSumAll / totalQtyAllSuppliers;
    const cheapestCost = ranked[0][1];
    const potentialSavingPerKg = actualBlendedCost - cheapestCost;
    if(potentialSavingPerKg > 0.01){
      const totalSavingPkr = potentialSavingPerKg * totalQtyAllSuppliers;
      const savingsNote = document.createElement("div");
      savingsNote.style.cssText = "background:rgba(74,157,132,0.12);border:1px solid var(--good);border-radius:6px;padding:8px 10px;margin-bottom:10px;font-size:12px;";

      wrap.appendChild(savingsNote);
    }
  }

  const lcTrend = landedCostMonthOverMonth(rows, mapping, headers);
  if(lcTrend){
    const up = lcTrend.pctChange >= 0;
    const trendNote = document.createElement("div");
    trendNote.className = "empty-note";

    wrap.appendChild(trendNote);
  }

  // Duty Paid / EFS filter, duplicated here for quick access while reviewing landed cost —
  // stays in sync with the same buttons elsewhere on the page (shared state).
  const schemeBar = document.createElement("div");
  schemeBar.style.cssText = "display:flex;gap:10px;margin-bottom:10px;";
  schemeBar.innerHTML = `
    <button class="btn small ${state.gdSchemeFilter.dutyPaid?'primary':''}" id="lc-toggle-duty-paid">Duty Paid (HC)</button>

  note.className = "empty-note";
  note.style.marginBottom = "6px";
  note.innerHTML = `<strong>How this is calculated:</strong> ${escHtml(formula)}, quantity-weighted across shipments.${escHtml(exclNote)}`;

  if(sroCols.length===0){

    sroNote.style.marginBottom = "6px";
    sroNote.textContent = "No SRO/regulatory reference columns found in this file — can't show which concessions apply.";

  table.className = "data-table";
  table.innerHTML = `
    <tr><th>#</th><th>${companyLabel}</th><th>Qty (MT)</th><th>% of Volume</th><th>Duty-Paid Cost / KG (PKR)</th>${sroCols.length?'<th>SRO / Regulatory Codes Applied</th>':''}<th>Diversification</th></tr>

        : '';
      const gapBadge = maxGapDays!==null && maxGapDays>=45

      return `

function pptxTopRows(rows, mapping, nameRole, countryRole){

// Full Company x Month-Year matrix (not capped to top 5) — powers the "EXPORTER/IMPORTER DATA
// BASED ON SELECTED ITEM" tabs. Each cell carries total qty and average unit price for that
// company in that month.
function fullCompanyMonthMatrix(rows, mapping, companyRole, maxCompanies){
  const nameCol = mapping && mapping[companyRole];
  if(!nameCol || !mapping.price || !mapping.qty) return null;

  const allCompanies = aggregateBy(rows, nameCol, mapping, companyKey).map(([n])=>n); // sorted by total qty desc
  const shown = allCompanies.slice(0, maxCompanies);
  const rest = allCompanies.length - shown.length;

  const cell = {};
  const monthsSet = new Set();
  rows.forEach(r=>{
    const name = matchCompanyName(r[nameCol], shown);
    if(!name) return;
    const d = rowDate(r, mapping);
    if(!d) return;
    const mk = monthKey(d);
    monthsSet.add(mk);
    cell[name] = cell[name] || {};
    cell[name][mk] = cell[name][mk] || { qty:0, sum:0, n:0, weightedSum:0, weightedQty:0, currency:null };
    const q = num(r[mapping.qty]); if(!isNaN(q)) cell[name][mk].qty += q;
    const p = num(r[mapping.price]);
    if(!isNaN(p)){
      cell[name][mk].sum += p; cell[name][mk].n++;
      if(!isNaN(q)){ cell[name][mk].weightedSum += p*q; cell[name][mk].weightedQty += q; }
    }
    if(!cell[name][mk].currency && mapping.currency && r[mapping.currency]) cell[name][mk].currency = r[mapping.currency];
  });

  const months = [...monthsSet].sort();
  return { companies: shown, months, cell, rest, totalCompanies: allCompanies.length };
}
